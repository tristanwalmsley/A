<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Besties Express ♡ Christmas 2026 (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--gold:#f6dc7a;--red:#c0313a;--pine:#1f6b4a;--ink:#06101e;--paper:#fffdf5;--lit:0}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--ink);font-family:Georgia,serif;color:var(--paper)}
#sky{position:fixed;inset:0;background:radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/80px 80px,radial-gradient(circle,#ffeaa8 0 1.2px,transparent 2px) 33px 47px/130px 130px,linear-gradient(#02060f,#0a2030 70%,#0f3a35)}
#aur{position:fixed;inset:0;opacity:0;transition:opacity 2s;background:radial-gradient(ellipse 60% 40% at 25% 18%,rgba(80,240,170,.5),transparent 70%),radial-gradient(ellipse 55% 35% at 75% 12%,rgba(240,100,190,.4),transparent 70%);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(5%) skewX(-4deg)}}
.layer{position:fixed;left:0;right:0;bottom:0;background-repeat:repeat-x;background-position:bottom}
#far{height:46%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='200'><path d='M0 200V120Q80 60 160 110T330 90T480 120T600 100V200Z' fill='%23123a45'/><path d='M0 200V150Q120 110 240 150T480 140T600 150V200Z' fill='%230e2e3a'/></svg>");background-size:600px 100%;opacity:.9}
#mid{height:34%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='140'><g fill='%230a2a1e'><path d='M40 20L62 60H18zM40 40L70 100H10zM40 70L82 140H0z'/><path d='M170 6L190 46H150zM170 28L198 84H142zM170 56L210 140H130z'/></g><g fill='%23e9f3f7'><path d='M40 20L46 31H34zM170 6L176 17H164z'/></g></svg>");background-size:240px 100%}
#world{position:fixed;left:0;bottom:0;height:100%;width:14500px;will-change:transform}
#track{position:absolute;left:0;right:0;bottom:56px;height:10px;background:repeating-linear-gradient(90deg,#4a3320 0 16px,#2a1c10 16px 20px);border-top:3px solid #aab4c0}
#snowfloor{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(#dfeaf2,#b9cbd9)}
.st{position:absolute;bottom:66px;width:120px;text-align:center;transition:filter .6s}
.st .pole{width:6px;height:150px;background:#2a1c10;margin:0 auto;position:relative}
.st .lamp{position:absolute;top:-16px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#33404c;border:2px solid #555;transition:all .8s}
.st.lit .lamp{background:radial-gradient(#fff6c8,var(--gold));box-shadow:0 0 30px 14px rgba(246,220,122,.65);border-color:var(--gold)}
.st .sign{margin-top:8px;font-family:Caveat,cursive;font-size:1.25rem;background:#1a2a38;border:2px solid #7a8a99;padding:.1rem .5rem;display:inline-block;border-radius:4px}
.st.here .sign{border-color:var(--gold);animation:pulse 1.4s infinite}.st.ghost .sign{border-color:#8f6bd8;color:#d9c7ff}.st.pm .sign{border-color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 14px 3px rgba(246,220,122,.7)}}
#train{position:fixed;left:60px;bottom:62px;width:330px;height:110px}
#train svg{width:100%;height:100%;animation:bob .5s ease-in-out infinite alternate}#train.stop svg{animation:none}
@keyframes bob{to{transform:translateY(-2px)}}
.puff{position:absolute;left:36px;bottom:92px;width:16px;height:16px;border-radius:50%;background:#fff;opacity:0;animation:puff 1.6s ease-out infinite}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-50px,-80px) scale(2.4)}}
#train.stop .puff{animation-duration:3.4s}
#hud{position:fixed;top:0;left:0;right:0;padding:.8rem 1.2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:linear-gradient(rgba(2,8,18,.85),transparent);z-index:5}
#hud h1{font:italic 700 clamp(1.1rem,3vw,1.7rem) 'Playfair Display',serif}#hud h1 b{color:var(--gold)}
#zone{font-family:Caveat,cursive;font-size:1.25rem;color:#bfe3ff}
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--pine),var(--gold));width:0;z-index:6;transition:width 1s}
#go{position:fixed;bottom:1.2rem;right:1.4rem;z-index:6;font:700 1.05rem 'Playfair Display',serif;padding:.8rem 1.5rem;background:var(--gold);color:#3a2010;border:0;box-shadow:4px 4px 0 var(--red);cursor:pointer}
#go:disabled{opacity:.45;cursor:wait}#go:hover:not(:disabled){transform:translate(-2px,-2px)}
#panel{position:fixed;inset:0;z-index:20;background:rgba(2,6,14,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1rem}
#panel.on{display:flex}
.card{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--paper);color:#3a2010;padding:1.6rem;border:3px solid var(--gold);box-shadow:8px 8px 0 var(--red);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}}
.card h2{font:italic 700 1.6rem 'Playfair Display',serif;margin-bottom:.2rem}.tag{font:1.1rem Caveat,cursive;color:var(--red);letter-spacing:2px;text-transform:uppercase}
.card p{margin:.7rem 0;line-height:1.5}.stage{margin:1rem 0;min-height:200px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.6rem}
.btn{font:700 1rem 'Playfair Display',serif;padding:.6rem 1.2rem;background:#3a2010;color:#faf4e8;border:0;cursor:pointer;box-shadow:3px 3px 0 var(--gold)}.btn[disabled]{opacity:.35}
.hint{font-style:italic;color:#7a5230;font-size:.9rem}
.gift{width:150px;height:130px;background:var(--c,#b3262e);position:relative;cursor:pointer;transition:transform .6s;box-shadow:inset 0 0 0 4px rgba(0,0,0,.08)}
.gift::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;background:var(--gold)}
.gift::after{content:'🎀';position:absolute;top:-30px;left:50%;margin-left:-22px;font-size:2.6rem;transition:all .8s}
.gift.open{transform:scale(1.15) rotate(8deg);opacity:.2}.gift.open::after{transform:translateY(-90px) rotate(60deg);opacity:0}
.env{width:230px;height:150px;background:#e8d6b0;position:relative;cursor:pointer;perspective:600px}
.env i{position:absolute;left:0;right:0;top:0;height:80px;background:#d4b483;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3}
.env.open i{transform:rotateX(180deg)}.env u{position:absolute;inset:14px;background:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font:1.3rem Caveat,cursive;transition:transform .8s .4s;text-align:center;padding:.5rem}
.env.open u{transform:translateY(-70px) scale(1.2);z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.win{position:relative;width:min(340px,100%);height:220px;touch-action:none}.win>div,.win canvas{position:absolute;inset:0;border:6px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.win>div{display:flex;align-items:center;justify-content:center;font:italic 1.2rem 'Playfair Display',serif;color:#fff;text-shadow:0 1px 4px #000;background:linear-gradient(135deg,#e07a5f,#3d405b)}
.proj{width:min(340px,100%);height:210px;display:flex;align-items:center;justify-content:center;font:italic 1.3rem 'Playfair Display',serif;color:#fff;border:6px solid #fff;transition:filter .15s;text-align:center;padding:1rem}
.proj.flash{filter:brightness(3) contrast(.6)}
.door{width:150px;height:200px;background:#7a4a28;border:6px solid #3a2010;position:relative;perspective:700px;display:flex;align-items:center;justify-content:center;background-image:linear-gradient(90deg,#6a3f20,#7a4a28)}
.door .lt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font:700 1rem 'Playfair Display',serif;color:#3a2010;background:radial-gradient(#fff6c8,var(--gold));padding:.5rem}
.door .lf{position:absolute;inset:0;background:#7a4a28;transform-origin:left;transition:transform 1.1s;display:flex;align-items:center;justify-content:flex-end;padding:.6rem;font-size:1.6rem;cursor:pointer}.door.open .lf{transform:rotateY(-110deg)}
.tape{width:260px;height:150px;background:#d9c7a0;border-radius:10px;border:4px solid #3a2010;position:relative;display:flex;justify-content:space-around;align-items:center;padding:0 30px}
.reel{width:50px;height:50px;border-radius:50%;border:6px dotted #3a2010;background:#fff}.tape.play .reel{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lyr{height:90px;overflow:hidden;text-align:center;font:italic 1.15rem 'Playfair Display',serif;width:100%}.lyr div{transition:all .6s;opacity:.25}.lyr div.cur{opacity:1;color:var(--red);transform:scale(1.08)}
.truck{background:#0b1117;padding:.8rem;width:100%;border:4px solid #2c3a46;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.mon{aspect-ratio:4/3;background:repeating-linear-gradient(0deg,#222 0 2px,#333 2px 4px);color:#6f6;font:.85rem monospace;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:2px solid #444;animation:flick 3s infinite;padding:.3rem}
.mon.on{background:#10281a;animation:none;color:#c8ffd6}.mon.big{grid-column:span 3;aspect-ratio:auto;min-height:100px}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.5}97%{opacity:.8}}
.cine{width:100%;aspect-ratio:16/9;background:#14080a;position:relative;overflow:hidden;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--paper)}
.cine iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cur2{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#8c1b24 0 18px,#a8222c 18px 36px);transition:transform 2.4s;z-index:3}.cur2.l{left:0}.cur2.r{right:0}.cine.open .l{transform:translateX(-100%)}.cine.open .r{transform:translateX(100%)}
.bulbs{height:14px;background:radial-gradient(circle,var(--gold) 0 4px,transparent 5px) 0 0/22px 14px;animation:chase 1s steps(2) infinite;width:100%}@keyframes chase{50%{filter:brightness(.4)}}
#toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--paper);color:#3a2010;padding:.5rem 1rem;z-index:30;font-family:Caveat,cursive;font-size:1.3rem;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="sky"></div><div id="aur"></div><div class="layer" id="far"></div><div class="layer" id="mid"></div>
<div id="world"><div id="snowfloor"></div><div id="track"></div></div>
<div id="train"><span class="puff"></span><span class="puff" style="animation-delay:.8s"></span>
<svg viewBox="0 0 330 110"><rect x="20" y="30" width="70" height="52" fill="#b3262e"/><rect x="12" y="20" width="86" height="12" fill="#2a1c10"/><rect x="28" y="6" width="14" height="26" fill="#2a1c10"/><rect x="40" y="40" width="22" height="22" fill="#f6dc7a"/><rect x="96" y="36" width="104" height="46" fill="#1f6b4a"/><rect x="206" y="36" width="104" height="46" fill="#1f6b4a"/><g fill="#f6dc7a"><rect x="108" y="46" width="20" height="16"/><rect x="140" y="46" width="20" height="16"/><rect x="172" y="46" width="20" height="16"/><rect x="218" y="46" width="20" height="16"/><rect x="250" y="46" width="20" height="16"/><rect x="282" y="46" width="20" height="16"/></g><rect x="10" y="82" width="302" height="6" fill="#2a1c10"/><g fill="#444" stroke="#999" stroke-width="3"><circle cx="40" cy="94" r="12"/><circle cx="80" cy="94" r="12"/><circle cx="130" cy="94" r="10"/><circle cx="250" cy="94" r="10"/><circle cx="290" cy="94" r="10"/></g></svg></div>
<div id="bar"></div>
<div id="hud"><h1>The Besties <b>Express</b> ♡</h1><div id="zone"></div><div id="cnt" style="font-family:Caveat,cursive;font-size:1.3rem"></div></div>
<button id="go">Open parcel 🎁</button>
<div id="panel"><div class="card" id="pc"></div></div><div id="toast"></div>
<script>
// ---- CONFIG: one entry per stop. Swap in real gifts here. media = optional file path ----
const YT_FULL='',YT_TRAILER='';   // paste YouTube IDs (unlisted) here
const N=40,GAP=340,ghostAt=19;
const S=[];const PAPER=['#b3262e','#2f6b4a','#6a4fb0','#d98a2b','#2b7a9a'];
for(let i=0;i<N;i++)S.push({t:'gift',title:'Placeholder gift '+(i+1),tag:'gift 🎁',hint:'Wrapped in '+['red','green','purple','orange','blue'][i%5]+' tissue paper, in the box.',desc:'Your real gift description goes here, in your words.',c:PAPER[i%5]});
Object.assign(S[0],{t:'card',title:'A Christmas Card',tag:'special ♡',desc:'Merry Christmas, Bestie! This one gives you the proper intro to the whole ride.'});
Object.assign(S[1],{t:'door',title:'New page unlocked: Us (winter)',tag:'page unlock ✦',desc:'A brand new corner of the site just opened.'});
Object.assign(S[3],{t:'img',title:'Frosted Window Photo',tag:'photo 📷',desc:'Wipe the frost off to see it. (A real photo goes under here.)'});
Object.assign(S[4],{t:'slides',title:'The Slide Show',tag:'photo set 🎞️',desc:'A little collection, projected one frame at a time.',slides:['Frame one: a memory','Frame two: a bad selfie','Frame three: us, honestly']});
Object.assign(S[6],{t:'song',title:'The Song (paper copy is in the box)',tag:'song 🎵',desc:'Lyrics play along here. Audio is optional, the paper is the real gift.',lyr:['Placeholder line one','Placeholder line two','Placeholder line three','Placeholder line four']});
Object.assign(S[ghostAt],{t:'ghost',title:'Platform 13 (unscheduled)',tag:'??? 👻'});
Object.assign(S[N-1],{t:'premiere',title:'Haunted Couture 2026',tag:'the premiere 🎬'});
const $=id=>document.getElementById(id);
const world=$('world'),far=$('far'),mid=$('mid'),go=$('go'),train=$('train');
let opened=new Set(),cur=0,x=0,busy=false;
try{opened=new Set(JSON.parse(localStorage.getItem('xmx_open')||'[]'))}catch(e){}
const q=new URLSearchParams(location.search);if(q.get('at'))cur=Math.min(N-1,+q.get('at'));if(q.get('skip'))for(let i=0;i<N-1;i++)opened.add(i);
// build stations
S.forEach((s,i)=>{const d=document.createElement('div');d.className='st'+(s.t=='ghost'?' ghost':s.t=='premiere'?' pm':'');d.id='st'+i;d.style.left=(440+i*GAP-60)+'px';
d.innerHTML='<div class="pole"><div class="lamp"></div></div><div class="sign">'+(s.t=='ghost'?'13':s.t=='premiere'?'🎬':(i+1))+'</div>';d.onclick=()=>{if(i==cur&&!busy)openStop()};world.appendChild(d)});
function zone(){return cur<13?'🇳🇱 the Dutch canals':cur<27?(cur==ghostAt?'👻 somewhere that is not on the map':'🌊 crossing the Channel'):'🇬🇧 Lancashire hills'}
function paint(){world.style.transform='translateX('+(-x)+'px)';far.style.backgroundPositionX=(-x*.12)+'px';mid.style.backgroundPositionX=(-x*.35)+'px'}
function hud(){$('zone').textContent=zone();$('cnt').textContent=opened.size+' / '+N;$('bar').style.width=(opened.size/N*100)+'%';
 $('aur').style.opacity=Math.min(1,opened.size/N*1.1);document.querySelectorAll('.st').forEach((e,i)=>{e.classList.toggle('lit',opened.has(i));e.classList.toggle('here',i==cur&&!opened.has(i))});
 go.textContent=opened.has(cur)?(cur==N-1?'The End ♡':'Chug on →'):'Open parcel 🎁';go.disabled=busy||(cur==N-1&&opened.has(cur))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function travel(to){busy=true;train.classList.remove('stop');hud();const a=x,b=to*GAP,t0=performance.now(),D=1900;
 (function f(n){const k=Math.min(1,(n-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;x=a+(b-a)*e;paint();if(k<1)requestAnimationFrame(f);else{cur=to;busy=false;train.classList.add('stop');hud()}})(t0)}
go.onclick=()=>{if(busy)return;if(!opened.has(cur))openStop();else if(cur<N-1)travel(cur+1)};
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='Enter')go.click();if(e.key=='Escape'&&$('panel').classList.contains('on'))finish()});
function finish(){$('panel').classList.remove('on');if(!opened.has(cur)){opened.add(cur);try{localStorage.setItem('xmx_open',JSON.stringify([...opened]))}catch(e){}if(opened.size==N)toast('✨ the star is on ✨')}hud()}
function yt(id,label){return id?'<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen allow="fullscreen"></iframe>':'<div style="padding:1rem;font-family:monospace;font-size:.85rem">[ '+label+' plays here, paste the YouTube ID into YT_'+(label=='trailer'?'TRAILER':'FULL')+' ]</div>'}
function openStop(){const s=S[cur],c=$('pc');let st='',ready=false,after=()=>{};
 c.innerHTML='<div class="tag">'+s.tag+'  ·  stop '+(cur+1)+' of '+N+'</div><h2>'+s.title+'</h2><div class="stage" id="stg"></div><p id="dsc" style="display:none">'+(s.desc||'')+'</p><p class="hint" id="hnt" style="display:none">'+(s.hint||'')+'</p><button class="btn" id="dn" disabled>Done ✓</button>';
 const g=$('stg'),dn=$('dn'),R=()=>{$('dsc').style.display=$('hnt').style.display='block';dn.disabled=false};
 if(s.t=='gift'){g.innerHTML='<div class="gift" style="--c:'+s.c+'"></div><div class="hint">click the ribbon to untie it</div>';g.firstChild.onclick=function(){this.classList.add('open');setTimeout(()=>{g.innerHTML='<div style="font-size:4rem">🎁</div>';R()},800)}}
 if(s.t=='card'){g.innerHTML='<div class="env"><i></i><u>'+s.desc+'</u></div><div class="hint">open the envelope</div>';g.firstChild.onclick=function(){this.classList.add('open');setTimeout(R,1200)}}
 if(s.t=='door'){g.innerHTML='<div class="door"><div class="lt">✦ '+s.title.split(': ')[1]+' ✦</div><div class="lf">🔑</div></div><div class="hint">turn the key</div>';g.firstChild.onclick=function(){this.classList.add('open');setTimeout(R,1200)}}
 if(s.t=='img'){g.innerHTML='<div class="win"><div>your photo here</div><canvas></canvas></div><div class="hint">wipe the frost with your finger or mouse</div>';const cv=g.querySelector('canvas'),w=g.querySelector('.win');cv.width=340;cv.height=220;const x2=cv.getContext('2d');x2.fillStyle='#cfe3f1';x2.fillRect(0,0,340,220);let n=0;
  const wipe=e=>{if(e.buttons==0&&e.pointerType=='mouse')return;const r=cv.getBoundingClientRect();x2.globalCompositeOperation='destination-out';x2.beginPath();x2.arc((e.clientX-r.left)*340/r.width,(e.clientY-r.top)*220/r.height,26,0,7);x2.fill();if(++n==60){cv.style.transition='opacity 1s';cv.style.opacity=0;R()}};cv.onpointermove=wipe;cv.onpointerdown=wipe}
 if(s.t=='slides'){let k=-1;g.innerHTML='<div class="proj" style="background:#222">🎞️</div><button class="btn" id="nx">Click-clack →</button>';const P=g.firstChild;$('nx').onclick=function(){k++;P.classList.add('flash');setTimeout(()=>{P.classList.remove('flash');P.textContent=s.slides[k];P.style.background='linear-gradient(135deg,hsl('+(k*90)+',60%,45%),#1a1a40)';if(k==s.slides.length-1){this.disabled=true;R()}},130)}}
 if(s.t=='song'){g.innerHTML='<div class="tape"><div class="reel"></div><div class="reel"></div></div><div class="lyr" id="ly"></div><button class="btn" id="pl">▶ Play the demo tape</button>';
  $('pl').onclick=function(){this.disabled=true;g.querySelector('.tape').classList.add('play');let k=0;const L=$('ly');(function nx(){L.innerHTML=s.lyr.map((l,j)=>'<div class="'+(j==k?'cur':'')+'">'+l+'</div>').join('');L.scrollTop=Math.max(0,k*28-20);if(++k<=s.lyr.length)setTimeout(nx,1600);else{g.querySelector('.tape').classList.remove('play');R()}})()}}
 if(s.t=='ghost'){const F=['CAM 1: the kitchen<br>(cold in here)','CAM 2: the tree room<br>👻 in a Santa hat','CAM 3: the stairs<br>EMF 5!','CAM 4: the attic<br>nothing. suspicious.','CAM 5: the cellar<br>mince pies?'];let seen=0;
  g.innerHTML='<div class="truck">'+F.map(f=>'<div class="mon">▒ no signal ▒<br>(click)</div>').join('')+'<div class="mon big" id="big">TRAILER MONITOR (click)</div></div><div class="hint">check every camera to identify the ghost</div>';
  g.querySelectorAll('.mon').forEach((m,i)=>m.onclick=function(){if(this.classList.contains('on'))return;this.classList.add('on');if(i<5)this.innerHTML=F[i];else{this.style.display='block';this.innerHTML='<div class="cine" style="border-color:#8f6bd8;aspect-ratio:16/9">'+yt(YT_TRAILER,'trailer')+'</div>'}if(++seen==6){toast('👻 ghost identified: Haunted Couture!');R()}})}
 if(s.t=='premiere'){g.style.width='100%';g.innerHTML='<div class="bulbs"></div><div class="cine" id="cn"><div style="padding:1rem"><div class="tag" style="color:var(--gold)">Besties Studios presents</div><h2 style="color:#fff;font-size:1.8rem">Phasmophobia Fashion Week<br>Haunted Couture 2026</h2></div><div class="cur2 l"></div><div class="cur2 r"></div></div><button class="btn" id="cu">Raise the curtain 🎬</button><div class="hint">full film (YouTube, unlisted) plays here. Chapters, intermission and resume-spot come in the full build.</div>';
  $('cu').onclick=function(){this.style.display='none';$('cn').classList.add('open');setTimeout(()=>{$('cn').insertAdjacentHTML('beforeend',yt(YT_FULL,'film'));R()},2500)}}
 dn.onclick=finish;$('panel').classList.add('on')}
paint();x=cur*GAP;paint();train.classList.add('stop');hud();
</script></body></html>
