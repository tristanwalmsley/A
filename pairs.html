<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besties ♡ Pairs</title>
<link rel="icon" type="image/x-icon" href="media/shared/images/site_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<script src="js/bestie_storage.js"></script>
<script src="js/theme.js"></script>
<style>
.pairs{max-width:560px;margin:1.6rem auto 4rem;padding:0 1rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.pr-head{width:100%;position:relative;background:var(--paper);border:1px solid var(--tan);box-shadow:4px 4px 0 var(--tan);padding:1.1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.pr-head::before{content:'';position:absolute;inset:6px;border:1px dashed var(--tan);pointer-events:none}
.pr-head h1{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:clamp(2.2rem,9vw,2.9rem);line-height:1;color:var(--deep)}
.pr-sub{font-family:var(--font-body);font-size:1.05rem;font-weight:600;color:var(--brown);margin-top:.35rem}
.pr-stats{display:flex;gap:.6rem;font-family:var(--font-hand);font-size:1.2rem;color:var(--brown);text-align:center}
.pr-stats b{display:block;font-family:var(--font-display);font-size:1.6rem;color:var(--deep);line-height:1}
.pr-ctl{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.pill{font-family:var(--font-hand);font-size:1.15rem;letter-spacing:.5px;padding:.3rem 1.1rem;border:1.5px solid var(--tan);background:var(--paper);color:var(--brown);cursor:pointer;border-radius:999px}
.pill:hover,.pill.on{background:var(--warm);color:var(--deep)}
.pill.on{border-color:var(--gold-dark)}
.grid{width:100%;display:grid;gap:.6rem;perspective:900px}
.card{aspect-ratio:3/4;position:relative;border:0;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.card.up,.card.done{transform:rotateY(180deg)}
.card .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;border:1px solid var(--tan);box-shadow:2px 2px 0 var(--tan);text-align:center;padding:.2rem}
.card .back{background:var(--paper);color:var(--rose);font-size:1.8rem;background-image:repeating-linear-gradient(45deg,transparent 0 7px,color-mix(in srgb,var(--tan) 35%,transparent) 7px 8px)}
.card .front{transform:rotateY(180deg);background:var(--warm)}
.card.done .front{background:color-mix(in srgb,var(--sage) 30%,var(--paper));border-color:var(--sage-dark)}
.card .em{font-size:clamp(1.6rem,7vw,2.3rem);line-height:1}
.card .lb{font-family:var(--font-hand);font-size:clamp(.85rem,3.2vw,1.1rem);color:var(--deep);line-height:1}
.card:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px}
.pr-fact{min-height:2.6em;text-align:center;font-family:var(--font-hand);font-size:1.3rem;color:var(--brown)}
.pr-end{display:none;width:100%;text-align:center;background:var(--paper);border:1px solid var(--tan);box-shadow:4px 4px 0 var(--gold);padding:1.2rem}
.pr-end.on{display:block}
.pr-end h2{font-family:var(--font-display);font-style:italic;color:var(--deep);font-size:1.8rem}
.pr-end p{font-size:1.1rem;color:var(--brown);margin-top:.4rem}
.pill.snd{font-size:1.05rem}
.heart{position:fixed;z-index:5;pointer-events:none;font-size:1.6rem;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-180px) scale(1.2)}}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){.card{transition:none}.heart{animation:none;display:none}}
</style>
</head>
<body>
<nav id="site-nav">
  <a href="index.html" class="nav-brand">Besties ♡</a>
  <div class="nav-links"></div>
</nav>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="pairs">
  <div class="pr-head">
    <div><h1>Pairs</h1><div class="pr-sub">find the matching postcards</div></div>
    <div class="pr-stats"><div><b id="moves">0</b>moves</div><div><b id="best">–</b>best</div></div>
  </div>
  <div class="pr-ctl" id="ctl"></div>
  <div class="pr-fact" id="fact" aria-live="polite">flip two cards ♡</div>
  <div class="grid" id="grid"></div>
  <div class="pr-end" id="end"><h2 id="endT"></h2><p id="endP"></p></div>
  <div class="pr-ctl"><button class="pill" id="again" type="button">new game</button><button class="pill snd" id="snd" type="button" aria-pressed="true">sound: on</button></div>
</div>
<script>
const BANK=[
 ['🍪','Biscuit','Officially tier-listed and rigorously tested.'],
 ['🫖','Kettle','Step one of any call involving tea.'],
 ['✉️','Letter','Handwritten, and archived.'],
 ['📮','Postbox','Hundreds of postcards, each way.'],
 ['🧸','Plushie','Supposed to travel twice a year.'],
 ['🍜','Noodles','Noodles Unite Us.'],
 ['✈️','Aeroplane','Every WWI postcard has its own sticker-covered envelope.'],
 ['🌧️','Croydon','Never has a bus trip been so bing chillin.'],
 ['🎄','Tree','Our first gift was a Christmas parcel in 2023.'],
 ['⛄','Snowman','Hello from the UK, with love.'],
 ['🎁','Gift','Birthdays and Christmasses: that is when the site grows.'],
 ['🕯️','Candle','Every birthday gets a wish.'],
 ['🧦','Socks','Winter essential. No notes.'],
 ['🍫','Bourbon','The chocolate one, obviously.']
];
const LEVELS={easy:{n:6,cols:4,name:'easy'},medium:{n:8,cols:4,name:'medium'},hard:{n:12,cols:6,name:'hard'}};
const KEY='besties_pairs_best_v1',SKEY='besties_pairs_sound_v1';
let sndOn=true;try{sndOn=localStorage.getItem(SKEY)!=='off'}catch(e){}
let AC=null;
function tone(f,t,d,v,type){
  if(!sndOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.12,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+.05);
  }catch(e){}
}
const sfx={
  flip:()=>tone(520,0,.08,.06,'triangle'),
  match:()=>{tone(784,0,.25);tone(1047,.09,.35)},
  miss:()=>tone(220,0,.18,.07,'triangle'),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.5,.12))
};
function hearts(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const e=['♡','❄','✦','♥'];
  for(let i=0;i<18;i++){const h=document.createElement('span');h.className='heart';h.textContent=e[i%e.length];
    h.style.left=(20+Math.random()*60)+'vw';h.style.top=(55+Math.random()*25)+'vh';h.style.color=i%2?'var(--rose)':'var(--gold)';
    h.style.setProperty('--dx',(Math.random()*160-80)+'px');h.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),2300)}
}
const $=id=>document.getElementById(id);
let level='easy',first=null,lock=false,moves=0,matched=0,total=0;
function bests(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function saveBest(l,m){const b=bests();if(!b[l]||m<b[l]){b[l]=m;try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}return true}return false}
function showBest(){const b=bests()[level];$('best').textContent=b||'–'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ctl(){const c=$('ctl');c.innerHTML='';Object.keys(LEVELS).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='pill'+(k===level?' on':'');b.textContent=LEVELS[k].name;b.onclick=()=>{level=k;ctl();start()};c.appendChild(b)})}
function start(){
  const L=LEVELS[level];first=null;lock=false;moves=0;matched=0;total=L.n;
  $('moves').textContent=0;$('end').classList.remove('on');$('fact').textContent='flip two cards ♡';showBest();
  const g=$('grid');g.innerHTML='';g.style.gridTemplateColumns='repeat('+L.cols+',1fr)';
  const deck=shuffle(shuffle(BANK.slice()).slice(0,L.n).flatMap(x=>[x,x]));
  deck.forEach((c,i)=>{
    const b=document.createElement('button');b.type='button';b.className='card';b.dataset.k=c[1];
    b.setAttribute('aria-label','card '+(i+1)+', face down');
    b.innerHTML='<div class="f back">♡</div><div class="f front"><span class="em">'+c[0]+'</span><span class="lb">'+c[1]+'</span></div>';
    b._c=c;b.onclick=()=>flip(b);g.appendChild(b);
  });
}
function flip(b){
  if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');b.setAttribute('aria-label',b._c[1]);sfx.flip();
  if(!first){first=b;return}
  moves++;$('moves').textContent=moves;
  const a=first;first=null;
  if(a.dataset.k===b.dataset.k){
    a.classList.replace('up','done');b.classList.replace('up','done');matched++;sfx.match();
    $('fact').textContent=b._c[0]+' '+b._c[2];
    if(matched===total)win();
  }else{
    lock=true;sfx.miss();
    setTimeout(()=>{a.classList.remove('up');b.classList.remove('up');a.setAttribute('aria-label','face down');b.setAttribute('aria-label','face down');lock=false},850);
  }
}
function win(){
  sfx.win();hearts();
  const isNew=saveBest(level,moves);showBest();
  $('endT').textContent=isNew?'A new best!':'All matched ♡';
  $('endP').textContent=moves+' moves on '+LEVELS[level].name+'. Try another level, or beat your own score.';
  $('end').classList.add('on');
}
$('again').onclick=start;
function sndLabel(){$('snd').textContent='sound: '+(sndOn?'on':'off');$('snd').setAttribute('aria-pressed',sndOn)}
$('snd').onclick=()=>{sndOn=!sndOn;try{localStorage.setItem(SKEY,sndOn?'on':'off')}catch(e){}sndLabel();if(sndOn)sfx.flip()};
sndLabel();
ctl();start();

/* gentle snow, off for reduced motion */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('snow'),x=c.getContext('2d');let w,h,f=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight}
  size();addEventListener('resize',size);
  for(let i=0;i<45;i++)f.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.2,s:.3+Math.random()*.7,d:Math.random()*6});
  (function tick(){
    x.clearRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.85)';x.strokeStyle='rgba(180,150,110,.35)';
    f.forEach(p=>{p.y+=p.s;p.d+=.01;p.x+=Math.sin(p.d)*.4;if(p.y>h+5){p.y=-5;p.x=Math.random()*w}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();x.stroke()});
    requestAnimationFrame(tick);
  })();
})();
</script>
<script src="js/nav.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>buildNav('pairs.html'));</script>
</body>
</html>
