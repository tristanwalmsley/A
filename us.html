<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besties ♡</title>
<link rel="icon" type="image/x-icon" href="media/shared/images/site_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<script src="js/theme.js"></script>
<style>
.page-header{text-align:center;padding:3rem 2rem 0.5rem;animation:headerIn 0.7s ease both}
@keyframes headerIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.content-wrap{max-width:600px;margin:0 auto;padding:2rem 1.5rem 6rem}
.section-rule{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem}
.rule-line{flex:1;height:1px;background:var(--tan)}
.rule-diamond{color:var(--gold);font-size:1rem}
.section-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:400;font-style:italic;color:var(--deep);margin-bottom:1.5rem}
/* FACTS */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:3.5rem}
.fact-card{background:var(--paper);border:1px solid var(--tan);padding:1.2rem 1.3rem;box-shadow:4px 4px 0 var(--warm);opacity:0;transform:translateY(16px);transition:opacity 0.5s ease,transform 0.5s cubic-bezier(0.22,1,0.36,1)}
.fact-card.visible{opacity:1;transform:translateY(0)}
.fact-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1}
.fact-label{font-family:'Caveat',cursive;font-size:0.95rem;color:var(--brown);margin-top:0.15rem;letter-spacing:0.5px;line-height:1.4}
/* PREDICTIONS */
.predictions-list{display:flex;flex-direction:column;gap:0.7rem}
.prediction-item{display:flex;align-items:flex-start;gap:0.8rem;background:var(--paper);border:1px solid var(--tan);padding:0.9rem 1.1rem;box-shadow:3px 3px 0 var(--warm);opacity:0;transform:translateX(-20px);transition:opacity 0.5s ease,transform 0.5s cubic-bezier(0.22,1,0.36,1)}
.prediction-item.visible{opacity:1;transform:translateX(0)}
.pred-checkbox{width:22px;height:22px;border:2px solid var(--gold);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.2s;margin-top:2px}
.pred-checkbox:hover{background:var(--warm)}
.pred-checkbox.checked{background:var(--sage);border-color:var(--sage);color:white;font-family:'Caveat',cursive;font-size:0.9rem}
.pred-text{font-size:0.97rem;line-height:1.65;color:var(--deep)}
.pred-text.checked-text{text-decoration:line-through;color:var(--brown);font-style:italic}
.pred-note{font-family:'Caveat',cursive;font-size:0.82rem;color:var(--rose);margin-top:0.2rem;letter-spacing:0.3px}
.pred-by{font-family:'Caveat',cursive;font-size:0.85rem;color:var(--sage);margin-top:0.15rem;letter-spacing:0.3px}
.pred-checkbox.busy{opacity:0.5;pointer-events:none}
.preds-note{font-family:'Caveat',cursive;font-size:0.9rem;color:var(--brown);margin-top:1.2rem;font-style:italic;text-align:center;letter-spacing:0.5px}
</style>
</head>
<body>
<nav id="site-nav" data-theme="light">
  <a href="index.html" class="nav-brand">Besties ♡</a>
  <div class="nav-links"></div>
</nav>

<div class="page-header page-header--std">
  <h1>Us, in numbers &amp; predictions</h1>
  <p>facts, figures, and a few things Tristan reckons will happen next year♡</p>
</div>

<div class="content-wrap">
  <div class="section-rule"><div class="rule-line"></div><div class="rule-diamond">✦</div><div class="rule-line"></div></div>
  <div class="section-title">Fun facts about us</div>
  <div class="facts-grid" id="facts-grid"></div>

  <div class="section-rule"><div class="rule-line"></div><div class="rule-diamond">✦</div><div class="rule-line"></div></div>
  <div class="section-title">Predictions for next year</div>
  <p style="font-family:'Caveat',cursive;font-size:0.95rem;color:var(--brown);margin:-0.5rem 0 1.2rem;letter-spacing:0.5px">check them off as they come true - that's Ann's job ♡</p>
  <div class="predictions-list" id="pred-list"></div>
  <p class="preds-note">made Apr 2026 · check back throughout the year</p>
</div>

<script src="js/bestie_storage.js"></script>
<script src="js/nav.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => { buildNav('us.html'); buildFacts(); buildPredictions(); });

const FACTS = [
  {num:'3.6',  label:'years of bestieship'},
  {num:'~588', label:'hours on call together on Discord (rough estimate -> Jul 24 - Apr 26)'},
  {num:'4',    label:'birthdays celebrated together'},
  {num:'3',    label:'Christmases celebrated'},
  {num:'7',    label:'gift exchanges'},
  // {num:'2',    label:'official bestie contracts signed'},
  {num:'?',   label:'postcards sent to Ann'},
  {num:'30',   label:'postcards sent to Tristan'},
  {num:'4',    label:'months of Tristan learning Dutchish'},
  {num:'1',    label:'plushie journies'},
  {num:'MANY',   label:'normal evenings made into uncontrollable laughter'},
];
function buildFacts(){
  const grid=document.getElementById('facts-grid');
  FACTS.forEach((f,i)=>{
    const c=document.createElement('div'); c.className='fact-card'; c.style.transitionDelay=i*0.06+'s';
    c.innerHTML=`<div class="fact-num">${f.num}</div><div class="fact-label">${f.label}</div>`;
    grid.appendChild(c);
  });
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:0.1});
  document.querySelectorAll('.fact-card').forEach(el=>obs.observe(el));
}

// Ticks are SHARED between you both (stored on the server via /api/prediction, same record for each of you).
// Every prediction has a stable id, so you can reorder / add / edit the list later without shifting anyone's ticks.
// (Keep the first 15 ids as they are - they match the old position-based ticks that were migrated across.)
const PREDICTIONS=[
  {id:'plushie_return', text:'The plushie will make its first return journey at Christmas if Ann remembers', note:'mark this off when it arrives back!'},
  {id:'ten_long_calls', text:'We will have ten more calls that go on for 10+ hours, unplanned'},
  {id:'ann_masters_something', text:'Ann will master something new and impressive (because they always slay at everything they do)'},
  {id:'dutch_progress', text:'The Dutch language learning will progress significantly by Ann\'s next birthday', note:'🇳🇱 evidence required'},
  {id:'more_insync', text:'We will become even more inexplicably insync'},
  {id:'new_bits', text:'We will start and maintain at least several new ongoing bits'},
  {id:'biscuit_tier_list', text:'Ann will use the biscuit tier list at least once more after today'},
  {id:'weekly_schedule', text:'The weekly schedule will live on another year... just about'},
  {id:'wren_married', text:'Wren will still be missing, and probably MARRIED?'},
  {id:'phas_monday', text:'Phas Monday will continue to live on'},
  {id:'games_list', text:'Ours list of games to play will continue to grow'},
  {id:'mandalorian', text:'Ann will have watched the Mandalorian series'},
  {id:'tristan_graduates', text:'TRISTAN WILL GRADUATE FROM UNIVERSITY'},
  {id:'better_friendship', text:'The friendship will be measurably better in year four than year three'},
  {id:'meet_irl', text:'Tristan and Ann will meet for the first time IRL in The Netherlands'},
];
const WHO={tristan:'Tristan',ann:'Ann'};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sharedPreds(){
  try{const s=JSON.parse(localStorage.getItem('besties_shared_v1'));return (s&&s.predictions)||{};}catch(e){return {};}
}
function buildPredictions(){
  const list=document.getElementById('pred-list');
  PREDICTIONS.forEach((p,i)=>{
    const item=document.createElement('div'); item.className='prediction-item'; item.dataset.id=p.id; item.style.transitionDelay=i*0.06+'s';
    item.innerHTML=`<div class="pred-checkbox" role="checkbox" tabindex="0" aria-label="Mark as done"></div>
      <div><div class="pred-text">${p.text}</div>${p.note?`<div class="pred-note">${p.note}</div>`:''}<div class="pred-by"></div></div>`;
    const box=item.querySelector('.pred-checkbox');
    box.addEventListener('click',()=>togglePred(p.id,box));
    box.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();togglePred(p.id,box);}});
    list.appendChild(item);
  });
  renderPreds();
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:0.1});
  document.querySelectorAll('.prediction-item').forEach(el=>obs.observe(el));
  // pick up ticks the other person made while this page was open
  const sync=()=>{if(window.BestieSync)BestieSync.refreshShared().then(renderPreds).catch(()=>{});};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();});
  window.addEventListener('focus',sync);
  sync();
}
function renderPreds(){
  const done=sharedPreds();
  document.querySelectorAll('.prediction-item').forEach(item=>{
    const rec=done[item.dataset.id], box=item.querySelector('.pred-checkbox');
    box.classList.toggle('checked',!!rec); box.textContent=rec?'✓':''; box.setAttribute('aria-checked',rec?'true':'false');
    item.querySelector('.pred-text').classList.toggle('checked-text',!!rec);
    item.querySelector('.pred-by').textContent=rec?('✓ ticked by '+(WHO[rec.by]||esc(rec.by))):'';
  });
}
async function togglePred(id,box){
  if(!window.BestieSync){alert('Could not reach the server - try reloading the page.');return;}
  const want=!box.classList.contains('checked');
  box.classList.add('busy');
  try{ await BestieSync.post('/api/prediction',{id,checked:want}); }   // post() refreshes the shared copy for us
  catch(e){ alert('That tick didn\'t save - check your connection and try again.'); }
  box.classList.remove('busy');
  renderPreds();
}
</script>
</body>
</html>
