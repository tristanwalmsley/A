<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besties ♡ Snow Globe</title>
<link rel="icon" type="image/x-icon" href="media/shared/images/site_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<script src="js/bestie_storage.js"></script>
<script src="js/theme.js"></script>
<style>
.sg{max-width:460px;margin:1.6rem auto 4rem;padding:0 1rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.sg h1{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:clamp(2.2rem,9vw,2.9rem);color:var(--deep)}
.globe{position:relative;width:min(86vw,340px);aspect-ratio:1;border-radius:50%;border:3px solid var(--tan);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--paper) 95%,transparent),color-mix(in srgb,var(--warm) 80%,var(--rose)) 85%);box-shadow:inset -12px -16px 30px color-mix(in srgb,var(--brown) 25%,transparent),4px 4px 0 var(--tan);overflow:hidden;cursor:pointer;touch-action:manipulation}
.globe canvas{position:absolute;inset:0;width:100%;height:100%}
.scene{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:3.4rem;line-height:1;pointer-events:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:16%;background:var(--paper);border-top:2px solid var(--tan)}
.base{width:min(70vw,260px);height:42px;margin-top:-1.1rem;background:var(--brown);border:2px solid var(--deep);border-radius:6px 6px 14px 14px;box-shadow:4px 4px 0 var(--tan)}
.globe.shake{animation:sh .5s}
@keyframes sh{20%{transform:translate(-6px,2px) rotate(-3deg)}40%{transform:translate(6px,-2px) rotate(3deg)}60%{transform:translate(-4px,1px) rotate(-2deg)}80%{transform:translate(4px,-1px) rotate(2deg)}}
#msg{min-height:3.6em;text-align:center;font-family:var(--font-hand);font-size:1.5rem;color:var(--brown);max-width:30ch}
.count{font-family:var(--font-hand);font-size:1.25rem;color:var(--rose-dark)}
.count b{font-family:var(--font-display);color:var(--deep)}
.hint{font-family:var(--font-body);font-size:1rem;color:var(--brown)}
.pill{font-family:var(--font-hand);font-size:1.15rem;padding:.3rem 1.1rem;border:1.5px solid var(--tan);background:var(--paper);color:var(--brown);cursor:pointer;border-radius:999px}
.pill:hover{background:var(--warm);color:var(--deep)}
@media (prefers-reduced-motion:reduce){.globe.shake{animation:none}}
</style>
</head>
<body>
<nav id="site-nav"><a href="index.html" class="nav-brand">Besties ♡</a><div class="nav-links"></div></nav>
<div class="sg">
  <h1>Snow Globe</h1>
  <div class="globe" id="globe" role="button" tabindex="0" aria-label="Shake the snow globe">
    <canvas id="cv"></canvas><div class="ground"></div><div class="scene">🏡🎄</div>
  </div>
  <div class="base"></div>
  <div id="msg" aria-live="polite"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="hint">tap, click or shake your phone</div>
  <button class="pill" id="btn" type="button">shake it</button>
</div>
<script>
const MSGS=[
 'Beans Meanz Heinz, and Christmas meanz you ♡',
 'Hello from the UK, with love.',
 'Biscuit status: dunked. Mood: bing chillin.',
 'Another year, another parcel on its way.',
 'The plushie is probably still hiding somewhere.',
 'Kettle on. Call soon?',
 'Noodles unite us, even in winter.',
 'Phas Monday will continue to live on.',
 'Wren is still missing. Probably married.',
 'Every postcard says: I was thinking of you.',
 'Best parts of the year: the ones with you in them.',
 'Happy Christmas, Bestie Ann ♡'
];
const $=id=>document.getElementById(id),g=$('globe'),c=$('cv'),x=c.getContext('2d');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,f=[],last=-1;
const FKEY='besties_snowglobe_found_v1';
let found=new Set();try{found=new Set(JSON.parse(localStorage.getItem(FKEY))||[])}catch(e){}
function renderCount(isNew){
  const n=found.size,t=MSGS.length;
  $('count').innerHTML=n?('messages found: <b>'+n+' / '+t+'</b>'+(isNew?' &nbsp;✦ new!':'')+(n===t?' &nbsp;all of them ♡':'')):'shake it to find the first message';
}
let AC=null;
function bells(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    [2093,2637,3136,2637,3520].forEach((fr,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+i*.07+Math.random()*.02;
      o.type='sine';o.frequency.value=fr;
      g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.05,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+.5);
      o.connect(g).connect(AC.destination);o.start(n);o.stop(n+.55);
    });
  }catch(e){}
}
function size(){const r=g.getBoundingClientRect();W=c.width=r.width;H=c.height=r.height}
size();addEventListener('resize',size);
for(let i=0;i<70;i++)f.push({x:Math.random()*W,y:H*(.75+Math.random()*.2),r:1+Math.random()*2.2,vx:0,vy:0,d:Math.random()*6});
function shake(){
  let i;const unseen=MSGS.map((m,k)=>k).filter(k=>!found.has(k)&&k!==last);
  if(unseen.length&&Math.random()<.75)i=unseen[Math.floor(Math.random()*unseen.length)];
  else do{i=Math.floor(Math.random()*MSGS.length)}while(i===last&&MSGS.length>1);last=i;
  const isNew=!found.has(i);found.add(i);
  try{localStorage.setItem(FKEY,JSON.stringify([...found]))}catch(e){}
  $('msg').textContent=MSGS[i];renderCount(isNew);bells();
  g.classList.remove('shake');void g.offsetWidth;if(!calm)g.classList.add('shake');
  f.forEach(p=>{p.vx=(Math.random()-.5)*5;p.vy=-(2+Math.random()*7)});
}
(function tick(){
  x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.95)';x.strokeStyle='rgba(180,150,110,.3)';
  f.forEach(p=>{
    p.d+=.03;p.vy+=.03;p.vy=Math.min(p.vy,.8);p.vx*=.97;
    p.x+=p.vx+Math.sin(p.d)*.3;p.y+=p.vy;
    const floor=H*.84-p.r;if(p.y>floor){p.y=floor-Math.random()*H*.04;p.vy=0}
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();x.stroke();
  });
  requestAnimationFrame(tick);
})();
g.onclick=shake;$('btn').onclick=shake;
g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();shake()}};
renderCount(false);
let lastM=0;
addEventListener('devicemotion',e=>{
  const a=e.accelerationIncludingGravity;if(!a)return;
  const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0),t=Date.now();
  if(m>32&&t-lastM>900){lastM=t;shake()}
});
</script>
<script src="js/nav.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>buildNav('snowglobe.html'));</script>
</body>
</html>
