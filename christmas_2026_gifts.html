<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Besties Express ♡ Christmas 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--gold:#f6dc7a;--red:#c0313a;--pine:#1f6b4a;--paper:#fffdf5;--ink:#3a2010}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#02060f;font-family:Georgia,serif;color:var(--paper);user-select:none;-webkit-user-select:none}
#sky{position:fixed;inset:0;background:radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/80px 80px,radial-gradient(circle,#ffeaa8 0 1.2px,transparent 2px) 33px 47px/130px 130px,linear-gradient(#02060f,#0a2030 70%,#0f3a35);transition:filter 3s}
#aur{position:fixed;inset:0;opacity:.1;transition:opacity 4s,filter 3s;background:radial-gradient(ellipse 60% 40% at 25% 18%,rgba(80,240,170,.55),transparent 70%),radial-gradient(ellipse 55% 35% at 75% 12%,rgba(240,100,190,.45),transparent 70%);animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(5%) skewX(-4deg)}}
#moon{position:fixed;top:10%;right:12%;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8eefc 55%,#a9b9de);box-shadow:0 0 60px 30px rgba(200,220,255,.25),0 0 220px 90px rgba(200,220,255,.12)}
.layer{position:fixed;left:0;right:0;bottom:0;background-repeat:repeat-x;background-position:bottom;transition:opacity 3s,filter 3s}
#far{height:48%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='220'><path d='M0 220V130Q90 60 180 118T370 96T540 128T700 104V220Z' fill='%23123a45'/><path d='M0 220V160Q140 118 280 160T560 148T700 160V220Z' fill='%230e2e3a'/></svg>");background-size:700px 100%}
#mid{height:36%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='150'><g fill='%230a2a1e'><path d='M44 20L66 62H22zM44 42L74 104H14zM44 72L88 150H0z'/><path d='M180 6L200 48H160zM180 30L208 88H152zM180 58L222 150H138z'/></g><g fill='%23e9f3f7'><path d='M44 20L50 32H38zM180 6L186 18H174z'/></g></svg>");background-size:260px 100%}
body[data-z="1"] #mid{opacity:0}
.fog{position:fixed;left:0;bottom:50px;width:200%;height:30%;opacity:.2;pointer-events:none;background:radial-gradient(ellipse 25% 50% at 20% 60%,#cfe3f1,transparent),radial-gradient(ellipse 30% 40% at 60% 70%,#cfe3f1,transparent),radial-gradient(ellipse 20% 50% at 90% 50%,#cfe3f1,transparent);animation:fg 70s linear infinite}@keyframes fg{to{transform:translateX(-50%)}}
#world{position:fixed;left:0;bottom:0;height:100%;width:150000px;transform-origin:0 100%;will-change:transform}
#world>*{position:absolute}
#gnd{left:0;right:0;bottom:0;height:56px;background:linear-gradient(#e6f0f6,#b9cbd9);z-index:1}
#trk{left:0;right:0;bottom:56px;height:10px;background:repeating-linear-gradient(90deg,#4a3320 0 16px,#2a1c10 16px 20px);border-top:3px solid #aab4c0;z-index:2}
#sea{bottom:0;height:56px;z-index:1;background:repeating-linear-gradient(90deg,transparent 0 70px,#2a1c10 70px 78px),linear-gradient(#2a7a9f,#0b2c45)}
#sea::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 30px 6px at 20px 12px,rgba(255,255,255,.45),transparent) 0 0/60px 24px;animation:wv 3s linear infinite}@keyframes wv{to{background-position:60px 0}}
.sc{position:absolute;bottom:66px;z-index:1;pointer-events:none}.sc.sea{bottom:56px}
.bl{transform-origin:50px 36px;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lh{animation:lhp 3s ease-in-out infinite alternate}@keyframes lhp{to{filter:drop-shadow(0 0 16px #ffe48a)}}
/* tunnels */
.tb{bottom:66px;height:210px;z-index:3;background:radial-gradient(circle at 50% 26px,#ffd98a 0 5px,rgba(255,200,100,.35) 6px,transparent 60px) 0 0/260px 100% repeat-x,repeating-linear-gradient(90deg,#150e09 0 120px,#0c0805 120px 132px)}
.td{bottom:66px;height:210px;z-index:7;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,6,.55) 7%,rgba(0,0,6,.55) 93%,transparent)}
.tf{bottom:276px;height:2400px;z-index:8;pointer-events:none;background:linear-gradient(#cfdde8 0 120px,#323c49 120px,#171d26);clip-path:polygon(0 100%,0 22%,9% 11%,26% 4%,50% 0,74% 4%,91% 11%,100% 22%,100% 100%);box-shadow:inset 0 -26px 30px rgba(0,0,0,.7)}
.tf::after{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;background:repeating-linear-gradient(90deg,#3a2c20 0 40px,#241a12 40px 44px)}
/* train */
#train{bottom:62px;left:0;width:330px;height:110px;z-index:5;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}#train svg{width:100%;height:100%}
.wh{transform-box:fill-box;transform-origin:center}#train.run .wh{animation:spin .45s linear infinite}#train.run svg{animation:bob .25s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}
#beam{bottom:112px;width:380px;height:100px;z-index:9;pointer-events:none;background:linear-gradient(90deg,rgba(255,240,180,.6),transparent);clip-path:polygon(0 42%,100% 0,100% 100%,0 58%);mix-blend-mode:screen}
/* stations */
.st{bottom:66px;width:520px;height:340px;z-index:3}.st>svg{position:absolute;left:0;bottom:0;width:520px;height:340px;overflow:visible}
.st::before{content:'';position:absolute;left:-40px;right:-40px;bottom:-10px;height:12px;background:#5a4633;border-top:3px solid #cfd8df}
.lp{position:absolute;left:-30px;bottom:0;width:6px;height:230px;background:#2a1c10}.lp b{position:absolute;top:-14px;left:-12px;width:30px;height:30px;border-radius:50%;background:#33404c;border:2px solid #555;transition:all 1s}
.st.lit .lp b{background:radial-gradient(#fff6c8,var(--gold));box-shadow:0 0 40px 18px rgba(246,220,122,.6);border-color:var(--gold)}
.lbl{position:absolute;left:-30px;bottom:240px;transform:translateX(-30%);font:1.3rem Caveat,cursive;background:#162735;border:2px solid #7a8a99;padding:.1rem .6rem;border-radius:4px;color:#d6e8f5;white-space:nowrap}
.pk{position:absolute;width:64px;height:56px;--pc:#b3262e;background:linear-gradient(var(--pc),color-mix(in srgb,var(--pc) 55%,#000));cursor:pointer;border-radius:3px;animation:pkb 1.8s ease-in-out infinite alternate;z-index:4;opacity:0;pointer-events:none;transition:opacity 1s}
.pk::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--gold)}.pk::after{content:'';position:absolute;left:-5px;right:-5px;top:-9px;height:15px;background:var(--pc);border-bottom:3px solid var(--gold);border-radius:3px}
.pk i{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(246,220,122,.55),transparent 68%);animation:pr 1.6s ease-in-out infinite;pointer-events:none}.pk u{position:absolute;top:-62px;left:50%;transform:translateX(-50%);font:1.15rem Caveat,cursive;color:#fff;text-shadow:0 0 8px #000;white-space:nowrap;text-decoration:none}
.st.act .pk{opacity:1;pointer-events:auto}.st.done .pk{display:none}@keyframes pkb{to{transform:translateY(-8px) rotate(3deg)}}@keyframes pr{50%{transform:scale(1.25);opacity:.6}}
.sm{fill:#fff;opacity:0;animation:smk 3.4s infinite}@keyframes smk{0%{opacity:.7;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(26px,-90px) scale(2.2)}}
.tw{animation:tw 1.4s infinite alternate}@keyframes tw{to{opacity:.2}}.rg{animation:rgg .5s infinite}@keyframes rgg{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.swy{transform-box:fill-box;transform-origin:50% 0;animation:swy 2s ease-in-out infinite alternate}@keyframes swy{to{transform:rotate(7deg)}}.bt{animation:btt 3s ease-in-out infinite alternate}@keyframes btt{to{transform:translateY(6px) rotate(2deg)}}
.hd{transform-origin:260px 130px;animation:spin 40s linear infinite}.bm{transform-origin:260px 72px;animation:spin 4s linear infinite}.ns{animation:ns .9s infinite alternate}@keyframes ns{to{fill:#400}}
/* hud */
.lb{position:fixed;left:0;right:0;height:4vh;background:#000;z-index:9}.lb.t{top:0}.lb.b{bottom:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,8,.7))}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:9;opacity:.07;mix-blend-mode:overlay;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .6s steps(4) infinite}@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}
#hud{position:fixed;top:calc(4vh + .7rem);left:1.3rem;z-index:10;opacity:0;transition:opacity 2s;pointer-events:none}body.on #hud,body.on #mn{opacity:1}
#hs{display:block;font:700 .95rem 'Playfair Display',serif;letter-spacing:4px;color:var(--gold)}#hz{display:block;font:1.15rem Caveat,cursive;color:#bfe3ff}
#bar{position:fixed;top:4vh;left:0;height:3px;background:linear-gradient(90deg,var(--pine),var(--gold));width:0;z-index:10;transition:width 1.5s}
#mn{position:fixed;top:calc(4vh + .6rem);right:1.2rem;z-index:11;opacity:0;transition:opacity 2s}#mb{background:rgba(0,0,0,.35);border:1px solid var(--gold);color:var(--gold);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.1rem}
#mm{display:none;position:absolute;right:0;top:46px;background:rgba(6,14,24,.94);border:1px solid var(--gold);padding:.4rem;min-width:170px}#mm.on{display:block}#mm button{display:block;width:100%;background:none;border:0;color:var(--paper);font:1.2rem Caveat,cursive;text-align:left;padding:.4rem .7rem;cursor:pointer}#mm button:hover{background:rgba(246,220,122,.15)}
#cap{position:fixed;left:0;right:0;bottom:calc(4vh + 1.6rem);text-align:center;z-index:12;font:italic 1.5rem 'Playfair Display',serif;color:#fff;text-shadow:0 2px 14px #000,0 0 3px #000;opacity:0;transition:opacity 1.2s;padding:0 2rem;pointer-events:none}#cap.on{opacity:1}
#chap{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.4s}#chap.on{opacity:1}#chap small{font:1.5rem Caveat,cursive;letter-spacing:10px;color:#9fc4e0;text-transform:uppercase}#chap b{font:italic 700 clamp(2.5rem,9vw,6.5rem) 'Playfair Display',serif;color:var(--gold);filter:drop-shadow(0 0 30px rgba(246,220,122,.4))}
#flash{position:fixed;inset:0;background:#fff;z-index:60;opacity:0;pointer-events:none}#flash.on{animation:fl2 .9s}@keyframes fl2{0%{opacity:.9}100%{opacity:0}}
html.haunt #sky{filter:hue-rotate(80deg) saturate(1.6)}html.haunt #aur{filter:hue-rotate(140deg)}html.haunt .layer,html.haunt #moon{filter:hue-rotate(70deg) brightness(.8)}
/* cards */
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(2,6,14,.45);backdrop-filter:blur(3px)}#ov.on{display:flex}
#ov.zn0{background:radial-gradient(circle at 15% 90%,rgba(255,170,70,.35),transparent 45%),rgba(22,8,4,.55)}#ov.zn1{background:radial-gradient(circle at 50% 110%,rgba(60,170,230,.5),transparent 55%),rgba(2,12,30,.6)}#ov.zn2{background:radial-gradient(circle at 50% 100%,rgba(255,150,60,.4),transparent 50%),rgba(8,18,10,.6)}
.card{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;padding:1.7rem;color:var(--ink);border-radius:4px;background:radial-gradient(ellipse at 30% 0,#fff,transparent 60%),linear-gradient(#fffdf5,#f4e8c8);box-shadow:0 0 0 3px #c99a2e,0 0 0 8px #fffdf5,0 0 0 10px #c99a2e,0 40px 90px rgba(0,0,0,.75);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}}
.card h2{font:italic 700 1.8rem 'Playfair Display',serif;background:linear-gradient(90deg,#3a2010 35%,#c99a2e 50%,#3a2010 65%) 0 0/250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}@keyframes sh{to{background-position:-250% 0}}
.tag{font:1.1rem Caveat,cursive;color:var(--red);letter-spacing:2px;text-transform:uppercase}.card p{margin:.7rem 0;line-height:1.5;font-size:1.08rem}.hint{font-style:italic;color:#7a5230}
.card.tg{background:repeating-linear-gradient(0deg,rgba(120,90,40,.05) 0 2px,transparent 2px 5px),#efe2bf;font-family:'Courier New',monospace;border-radius:0;box-shadow:0 0 0 2px #8a6b3a,0 30px 80px rgba(0,0,0,.8);transform:rotate(-1deg)}
.tgh{text-align:center;font-weight:700;letter-spacing:3px;border-bottom:2px solid var(--ink);padding-bottom:.5rem}.tgm{margin:.6rem 0;font-size:.85rem;letter-spacing:2px;color:#8a1c24}.tgb{min-height:110px;font-size:1.25rem;line-height:1.6;white-space:pre-wrap}.tgs{text-align:center;margin:1rem 0;font-size:.8rem;letter-spacing:2px}
.btn{font:700 1rem 'Playfair Display',serif;padding:.7rem 1.3rem;background:var(--ink);color:#faf4e8;border:0;cursor:pointer;box-shadow:3px 3px 0 var(--gold)}.btn[disabled]{opacity:.35}
#dn{display:block;margin:.6rem auto 0;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e04a54,#8a1c24);color:#ffe9b0;box-shadow:0 4px 0 #5a1018;font-size:.85rem;padding:0}#dn:not([disabled]){animation:seal 1.6s ease-in-out infinite alternate}@keyframes seal{to{box-shadow:0 4px 0 #5a1018,0 0 22px 6px rgba(224,74,84,.5)}}
.pol{margin:1rem auto;width:min(300px,80%);background:#fff;padding:12px 12px 4px;transform:rotate(-2.5deg);box-shadow:0 10px 24px rgba(0,0,0,.4);position:relative}.pol::before{content:'';position:absolute;top:-12px;left:50%;width:80px;height:24px;margin-left:-40px;background:rgba(246,220,122,.7);transform:rotate(3deg);z-index:3}
.pol img,.ph{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.ph{display:flex;align-items:center;justify-content:center;background:#e8dcc8;text-align:center;padding:1rem;font:1.2rem Caveat,cursive;color:var(--ink)}.pol b{display:block;text-align:center;font:1.05rem Caveat,cursive;color:#7a5230;padding:.4rem 0}.pol canvas{position:absolute;left:12px;top:12px;width:calc(100% - 24px);aspect-ratio:4/3;z-index:2;touch-action:none}
.tape{width:240px;height:120px;margin:.6rem auto;background:#d9c7a0;border-radius:10px;border:4px solid var(--ink);display:flex;justify-content:space-around;align-items:center;padding:0 30px}.reel{width:46px;height:46px;border-radius:50%;border:6px dotted var(--ink);background:#fff}.tape.play .reel{animation:spin 1.4s linear infinite}
.lyr{text-align:center;font:italic 1.15rem 'Playfair Display',serif;min-height:96px}.lyr div{opacity:.25;transition:all .6s}.lyr div.cur{opacity:1;color:var(--red);transform:scale(1.08)}
/* intro / finale / van / premiere */
#intro,#fin{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#0d2538,#010409);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 2.2s}#intro.out{opacity:0;pointer-events:none}#intro>*{opacity:0;animation:fi 2.2s forwards}@keyframes fi{to{opacity:1}}
.i1{font:1.5rem Caveat,cursive;letter-spacing:6px;color:#9fc4e0;animation-delay:.6s!important}.i2{font:italic 700 clamp(2.6rem,10vw,7rem) 'Playfair Display',serif;line-height:1;background:linear-gradient(100deg,#c99a2e 30%,#fff7c8 50%,#c99a2e 70%) 0 0/300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fi 2.4s 2.2s forwards,sh2 4s 3s linear infinite!important}@keyframes sh2{to{background-position:-300% 0}}.i3{font:1.3rem 'Playfair Display',serif;letter-spacing:8px;text-transform:uppercase;margin-top:1rem;animation-delay:4.4s!important}.i4{margin-top:2.4rem;animation-delay:6s!important}
#fin{display:none;background:rgba(0,2,8,.9);overflow:hidden}#fin.on{display:flex}#fin .star{font-size:6rem;color:var(--gold);filter:drop-shadow(0 0 40px var(--gold));position:absolute;top:6%;animation:sp 3s ease-in-out infinite alternate}@keyframes sp{to{transform:scale(1.2) rotate(15deg)}}
.roll{position:absolute;top:100%;left:0;right:0;animation:rl 40s linear forwards;font:1.4rem 'Playfair Display',serif;line-height:2.4}.roll h3{font:italic 700 3rem 'Playfair Display',serif;color:var(--gold);margin:2rem 0 0}.roll i{color:#9fc4e0;font-size:1rem;letter-spacing:4px;display:block;text-transform:uppercase}@keyframes rl{to{transform:translateY(calc(-100% - 100vh))}}
#van{position:fixed;inset:0;z-index:30;display:none;background:#05020c;overflow:hidden}#van.on{display:block}.vint{position:absolute;inset:0;background:linear-gradient(#0d1a1f,#14262b 62%,#1a1510 62%)}.vint .it{position:absolute;font-size:clamp(3rem,8vw,5.5rem);cursor:pointer;transform:translate(-50%,-50%);transition:transform .3s;filter:drop-shadow(0 0 14px #6f6)}.vint .it:hover{transform:translate(-50%,-50%) scale(1.25)}.it.dn{filter:grayscale(1) opacity(.5)!important}
#dark{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle 230px at var(--mx,50%) var(--my,50%),transparent 0,rgba(0,0,8,.93) 100%)}#van.strobe #dark{animation:sb .2s steps(2) 6}@keyframes sb{50%{opacity:0}}
.vcap{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:italic 1.5rem 'Playfair Display',serif;color:#cdbfff;text-shadow:0 0 12px #000;z-index:5;padding:0 1rem;pointer-events:none}.vprog{position:absolute;top:5%;left:0;right:0;text-align:center;font:1.3rem Caveat,cursive;letter-spacing:4px;color:#9fe8b4;z-index:5}
.vmod{position:absolute;inset:0;z-index:6;background:rgba(0,0,6,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:1rem}.vmod.on{display:flex}.vgal{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center}.vgal .pol{width:190px;margin:.4rem}.crt{width:min(780px,94vw);border:14px solid #2c3a46;border-radius:22px;box-shadow:0 0 60px #4f8;background:#000;aspect-ratio:16/9;position:relative;overflow:hidden;color:#bfd}.crt iframe,.cine iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vghost{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:14rem;z-index:4;filter:drop-shadow(0 0 60px #b79bff);animation:gp 1.5s ease-out;pointer-events:none}@keyframes gp{from{transform:translate(-50%,-50%) scale(.1);opacity:0}}
#pm{position:fixed;inset:0;z-index:30;display:none;background:radial-gradient(ellipse at 50% 30%,#2a0d10,#07020a);flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;text-align:center}#pm.on{display:flex}
.cine{width:min(900px,96vw);aspect-ratio:16/9;background:#14080a;position:relative;overflow:hidden;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(246,220,122,.3)}
.cur2{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#8c1b24 0 18px,#a8222c 18px 36px);transition:transform 3s;z-index:3}.cur2.l{left:0}.cur2.r{right:0}.cine.open .l{transform:translateX(-100%)}.cine.open .r{transform:translateX(100%)}
.bulbs{height:14px;width:min(900px,96vw);background:radial-gradient(circle,var(--gold) 0 4px,transparent 5px) 0 0/22px 14px;animation:chase 1s steps(2) infinite}@keyframes chase{50%{filter:brightness(.4)}}
@media (prefers-reduced-motion:reduce){#grain,.fog{animation:none}}

#cap{bottom:4vh;padding:3rem 2rem 1.4rem;font-size:1.75rem;background:linear-gradient(transparent,rgba(0,0,10,.78) 65%)}
.layer{transform-origin:50% 100%}
#canal{bottom:0;height:56px;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 90px,#4a3a30 90px 98px),linear-gradient(#8a5a45 0 5px,#2f7482 5px,#0e2c38)}

const LINES=['A log cabin with a fire so cosy it has been known to melt entire timetables.','A snowman made it all this way. Nobody knows how he crossed the water.','A tree in full lights, standing alone, absolutely certain it is the main character.','The old clocktower is five minutes wrong, and the whole town agreed to be wrong with it.','The harbourmaster is a goose. He has never once been wrong about the weather.','The miller insists the sails turn faster whenever someone is being talked about.','A stall selling warm stroopwafels. The queue is one person, and she is a pigeon.','A red phone box in the middle of a field. It has rung twice since you started reading this.','The reindeer are on a break and have asked not to be photographed.','A lighthouse stands where the land runs out. It has opinions about the dark.','The glasshouse never stops blooming in winter. Nobody has asked it to explain itself.','The canal froze overnight. One skater has been practising the same figure-eight since October.','The landlord says the ghost is a regular, and the goose is a menace.','The church bells have not been wound in years, but they ring whenever someone laughs.','A penguin in a scarf, going the wrong way. He insists it is on purpose.','A bike shop where the handlebar bells ring in harmony if you ignore them.','A cheese cart parked on the quay, “just closing” since 1987.','The carousel plays one song and nobody can agree what it is.','A single buoy blinking Morse code: “still here, still blinking.”','A crane lifting parcels that nobody will admit to ordering.','An ice-fishing shack. The fish inside are, by all accounts, thriving without you.','A mast pokes out of the black water. The sea is being unusually polite about it.','The bakery that never runs out of mince pies. Nobody has found out why.','Old stones, waiting for someone to ask them anything.','Forty sheep and one very smug llama.','The toy shop window shows exactly what you wanted at age seven. Suspicious.','A band $('mb').onclick=()=>$('mm').classList.toggle('on');$('m1').onclick=()=>setMute(!muted);$('m2').onclick=()=>whistle();
$('m3').onclick=()=>{if(confirm('Reset ALL progress and start the journey again?')){try{localStorage.removeItem('xmx2_open')}catch(e){}location.href=location.pathname}};
$('m4').onclick=()=>{$('mm').classList.remove('on');if(st=='go')go0=performance.now()-goD;else say('Skip only works while the train is moving.',2600)};
const jg=$('jg');for(let n=1;n<=N;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>jumpTo(n-1);jg.appendChild(b)}
$('m5').onclick=()=>{jg.style.display=jg.style.display=='grid'?'none':'grid'};
$('vol').oninput=e=>{vol=+e.target.value;if(bus&&!muted)bus.gain.value=vol;if(musEl)musEl.volume=.6*vol};
$('again').onclick=()=>$('fin').classList.remove('on');
addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H')whistle()});
function jumpTo(u){u=Math.max(0,Math.min(N-1,u));opened=new Set();for(let i=0;i<u;i++)opened.add(i);try{localStorage.setItem('xmx2_open',JSON.stringify([...opened]))}catch(e){}
 $('ov').classList.remove('on');$('van').className='';$('van').innerHTML='';$('pm').classList.remove('on');$('pm').innerHTML='';$('fin').classList.remove('on');document.documentElement.classList.remove('haunt');$('mm').classList.remove('on');
 document.querySelectorAll('.st.act').forEach(e=>e.classList.remove('act'));B.classList.add('on');$('intro').classList.add('out');
 tx=trX(u)-1;cur=u;foc=focT=tx+380;v=0;mmode=u==N-1?'f':u==19?'g':zoneS(u);train.classList.remove('run');train.style.transform='translateX('+tx+'px)';hud();arrive();au();startMusic()}
const begin=fast=>{B.classList.add('on');if(q.get('at')||q.get('skip'))history.replaceState(null,'',location.pathname);$('intro').classList.add('out');st='wait';
 let u=0;while(u<N&&opened.has(u))u++;if(q.get('at'))u=Math.min(N-1,+q.get('at'));if(q.get('skip'))for(let i=0;i<u;i++)opened.add(i);
 if(u>=N)u=0;
 if(u>0||fast){jumpTo(u);return}
 au();startMusic();whistle();setTimeout(()=>chap(CH[0]),1200);setTimeout(()=>say('Welcome aboard the Besties Express.',5200),5200);setTimeout(()=>{if(st=='wait'&&cur<0)goTo(0)},5800)};
$('aboard').onclick=()=>begin(false);
if(q.get('skip')||q.get('at')||opened.size>0)addEventListener('pointerdown',()=>startMusic(),{once:true});
if(q.get('skip')||q.get('at'))begin(true);else if(opened.size>0){$('aboard').textContent='Continue the journey 🚂';$('aboard').onclick=()=>{au();startMusic();begin(true)}}
if(st=='intro')foc=focT=380;hud();requestAnimationFrame(frame);
})();
</script></body></html>
