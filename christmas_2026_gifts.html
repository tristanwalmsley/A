<style>

for(let i=0;i<240;i++)P.push({k:'s',x:rnd(0,innerWidth),y:rnd(0,innerHeight),z:rnd(.2,1),o:rnd(0,9)});

/* ================= camera + state ================= */
let SC=1;const setSC=()=>{SC=innerWidth<700?1:Math.max(1,Math.min(1.8,innerHeight/560))};setSC();addEventListener('resize',setSC);
let tx=0,cam=0,zc=1,fxc=.3,foc=0,zT=1,fxT=.3,focT=0,v=0,fr=0,lastT=0,st='intro',cur=-1,go0=0,goD=1,goFrom=0,goTarget=0,said=0,chugD=0;
let opened=new Set();try{opened=new Set(JSON.parse(localStorage.getItem('xmx2_open')||'[]'))}catch(e){}
const q=new URLSearchParams(location.search);
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function hud(){const zn=['the Dutch canals','the Channel','the Lancashire hills'];$('hs').textContent='STOP '+pad(Math.max(1,cur+1))+' / '+N;$('hz').textContent=zn[zoneX(tx)];$('bar').style.width=(opened.size/N*100)+'%';$('aur').style.opacity=.1+Math.min(.9,opened.size/N);B.dataset.z=zoneX(tx);
 for(let i=0;i<N;i++){const e=$('st'+i);e.classList.toggle('lit',opened.has(i));e.classList.toggle('done',opened.has(i))}}
function goTo(i){cur=i;st='go';goFrom=tx;goTarget=trX(i);goD=Math.max(6500,(goTarget-goFrom)*2.9);go0=performance.now();said=0;train.classList.add('run');whistle();hiss(.25);
 const prev=document.querySelector('.st.act');prev&&prev.classList.remove('act');if(i==19)document.documentElement.classList.add('haunt');if(CH[i])setTimeout(()=>chap(CH[i]),goD*.55);mmode=i==N-1?'f':i==19?'g':zoneS(i);hud()}
function arrive(){st='idle';v=0;train.classList.remove('run');hiss(.3);tunnelAudio(false);focT=stX(cur)+20;zT=1.22;fxT=.5;$('st'+cur).classList.add('act');hud();say(cur==19?'Something is humming in the dark…':'Next to the track, something is waiting for you.',4200)}
function finish(){const i=cur;opened.add(i);try{localStorage.setItem('xmx2_open',JSON.stringify([...opened]))}catch(e){}
 $('ov').classList.remove('on');$('van').className='';$('van').innerHTML='';$('pm').classList.remove('on');$('pm').innerHTML='';document.documentElement.classList.remove('haunt');mmode=zoneS(i);
 chime();burst(innerWidth*.55,innerHeight*.5,90);hud();zT=1.15;
 if(i==N-1){st='end';setTimeout(finale,1200);return}

/* ================= main loop ================= */
function frame(t){const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;fr++;
 if(st=='go'){const p=Math.min(1,(t-go0)/goD),np=goFrom+(goTarget-goFrom)*ease(p);v=(np-tx)/dt;tx=np;focT=tx+380;fxT=.34;zT=1;
  if(p>.2&&said==0){said=1;say(LORE[(cur*2)%LORE.length],5200)}if(p>.62&&said==1){said=2;say(LORE[(cur*2+1)%LORE.length],5200)}
  chugD+=Math.abs(tx-(frame.l||tx));if(chugD>150){chugD=0;hiss(.05+Math.min(.1,Math.abs(v)/5000))}if(p>=1)arrive()}
 frame.l=tx;
 const k=1-Math.pow(.02,dt);foc+=(focT-foc)*k;zc+=(zT-zc)*k;fxc+=(fxT-fxc)*k;
 cam=foc-fxc*innerWidth/(SC*zc);const sz=SC*zc;
 world.style.transform='scale('+sz+') translateX('+(-cam)+'px)';far.style.backgroundPositionX=(-cam*sz*.1)+'px';mid.style.backgroundPositionX=(-cam*sz*.3)+'px';
 train.style.transform='translateX('+tx+'px)';$('beam').style.transform='translateX('+(tx+322)+'px)';
 const it=TR.some(([a,b])=>tx+160>a&&tx+160<b);tunnelAudio(it);
 const c0=Math.floor((cam-500)/CW),c1=Math.floor((cam+innerWidth/sz+500)/CW);for(let c=c0;c<=c1;c++)if(!act.has(c))chunk(c);for(const [c,d] of act)if(c<c0-1||c>c1+1){d.remove();act.delete(c)}
 /* particles */
 const dx=v*sz*dt;c2.clearRect(0,0,cv.width,cv.height);
 if(fr%(st=='go'?4:14)==0)P.push({k:'p',x:(tx+244-cam)*sz,y:innerHeight-(62+104)*sz,vx:-.3-Math.max(0,dx)*.35,vy:-1.2,r:5*sz,l:0});
 if(!shoot&&Math.random()<.004)shoot={x:rnd(innerWidth*.3,innerWidth),y:rnd(0,innerHeight*.3),l:0};
 if(shoot){c2.strokeStyle='rgba(255,255,255,'+(1-shoot.l/30)+')';c2.lineWidth=2;c2.beginPath();c2.moveTo(shoot.x,shoot.y);c2.lineTo(shoot.x+90,shoot.y-40);c2.stroke();shoot.x-=14;shoot.y+=6;if(++shoot.l>30)shoot=0}
 for(let i=P.length-1;i>=0;i--){const p=P[i];
  if(p.k=='s'){p.y+=.6+p.z*1.7;p.x+=Math.sin(t/900+p.o)*.4-.25-dx*p.z*1.1;if(p.y>innerHeight)p.y=-5;if(p.x<-20)p.x=innerWidth+10;if(p.x>innerWidth+20)p.x=-10;c2.fillStyle='rgba(255,255,255,'+(.35+p.z*.55)+')';if(Math.abs(dx)>5)c2.fillRect(p.x,p.y,Math.abs(dx)*p.z*1.6,1.5);else{c2.beginPath();c2.arc(p.x,p.y,p.z*2.3,0,6.3);c2.fill()}}
  else if(p.k=='p'){p.x+=p.vx;p.y+=p.vy;p.r+=.35;p.l++;c2.fillStyle='rgba(235,240,248,'+Math.max(0,.55-p.l/110)+')';c2.beginPath();c2.arc(p.x,p.y,p.r,0,6.3);c2.fill();if(p.l>110)P.splice(i,1)}
  else{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.985;p.l--;c2.globalAlpha=Math.max(0,p.l/p.m);c2.fillStyle=p.col;c2.beginPath();c2.arc(p.x,p.y,2.4,0,6.3);c2.fill();c2.globalAlpha=1;if(p.l<=0)P.splice(i,1)}}
 requestAnimationFrame(frame)}
/* ================= stops ================= */
const polH=i=>{const s=S[i];return '<div class="pol"><img src="'+(s.img||'xmas_images/gift'+pad(i+1)+'.jpg')+'" alt="" onerror="this.outerHTML=\'<div class=ph>📸 photo of Tristan with this gift goes here</div>\'"><b>stop '+(i+1)+' · me with it irl ♡</b></div>'};
function openStop(i){if(st!='idle')return;st='ui';const s=S[i];zT=1.45;focT=stX(i)+140;
 if(s.t=='van')return van(i);if(s.t=='premiere')return premiere(i);
 const ov=$('ov'),pc=$('pc');ov.className='on zn'+zoneS(i);pc.className='card tg';
 pc.innerHTML='<div class="tgh">★ BESTIES EXPRESS TELEGRAPH ★</div><div class="tgm">STOP '+(i+1)+' OF '+N+' · URGENT · TO: ANN</div><div class="tgb" id="tgb"></div><div class="tgs">— STOP —<br>ONLY WHEN IT’S IN YOUR HANDS, PRESS BELOW</div><div style="text-align:center"><button class="btn" id="op" disabled>I’ve opened it 🎁</button></div>';
 tone(300,0,.15,'square',.04);typeTo($('tgb'),'CLUE: '+(s.hint||'Have a look in the box.'),()=>$('op').disabled=false);
 $('op').onclick=()=>{flash();chime();burst(innerWidth/2,innerHeight/2,110);setTimeout(()=>info(i),520)}}
function info(i){const s=S[i],pc=$('pc');pc.className='card';
 pc.innerHTML='<div class="tag">'+s.tag+' · stop '+(i+1)+'</div><h2>'+s.title+'</h2><div id="stg">'+(s.t=='slides'?'':polH(i))+'</div><p id="dsc" style="display:none">'+(s.desc||'')+'</p><button class="btn" id="dn" disabled>Done ✓</button>';
 const R=()=>{const d=$('dsc'),t=d.textContent;d.style.display='block';d.textContent='';let n=0;const iv=setInterval(()=>{d.textContent=t.slice(0,++n);if(n>=t.length){clearInterval(iv);$('dn').disabled=false}},16)};$('dn').onclick=finish;
 const g=$('stg');
 if(s.t=='img'){const p=g.querySelector('.pol'),c=document.createElement('canvas');c.width=300;c.height=225;p.appendChild(c);const x=c.getContext('2d');x.fillStyle='#cfe3f1';x.fillRect(0,0,300,225);let n=0;const w=e=>{if(e.buttons==0&&e.pointerType=='mouse')return;const r=c.getBoundingClientRect();x.globalCompositeOperation='destination-out';x.beginPath();x.arc((e.clientX-r.left)*300/r.width,(e.clientY-r.top)*225/r.height,26,0,7);x.fill();if(++n==55){c.style.transition='opacity 1s';c.style.opacity=0;tone(1400,0,.5,'sine',.06);R()}};c.onpointermove=w;c.onpointerdown=w;g.insertAdjacentHTML('beforeend','<div class="hint" style="text-align:center">wipe the frost off with your finger or mouse</div>')}
 else if(s.t=='slides'){let k=-1;g.innerHTML='<div class="pol"><div class="ph" id="pf">🎞️</div><b>click-clack</b></div><div style="text-align:center"><button class="btn" id="nx">Next frame →</button></div>';$('nx').onclick=function(){k++;flash();$('pf').textContent=s.slides[k];$('pf').style.background='hsl('+(k*80+20)+',50%,75%)';tone(900,0,.05,'square',.05);if(k==s.slides.length-1){this.disabled=true;R()}}}
 else if(s.t=='song'){g.innerHTML='<div class="tape" id="tp"><div class="reel"></div><div class="reel"></div></div><div class="lyr" id="ly"></div><div style="text-align:center"><button class="btn" id="pl">▶ Play the demo tape</button></div>';$('pl').onclick=function(){this.disabled=true;$('tp').classList.add('play');let k=0;(function nx(){$('ly').innerHTML=s.lyr.map((l,j)=>'<div class="'+(j==k?'cur':'')+'">'+l+'</div>').join('');if(++k<=s.lyr.length)setTimeout(nx,1700);else{$('tp').classList.remove('play');R()}})()}}
 else R()}
/* stop 20: the van */
function van(i){const v=$('van');let found={};v.className='on';mmode='g';
 v.innerHTML='<div class="vint"><div class="it" data-k="cam" style="left:14%;top:64%">📷</div><div class="it" data-k="rad" style="left:34%;top:34%">📻</div><div class="it" data-k="jr" style="left:52%;top:72%">📖</div><div class="it" data-k="emf" style="left:70%;top:64%">📟</div><div class="it" data-k="mon" style="left:85%;top:28%">🖥️</div></div><div id="dark"></div><div class="vprog" id="vp"></div><div class="vcap" id="vc"></div><div class="vmod" id="vm"></div>';
 flash();tone(80,0,1.2,'sawtooth',.06);v.onpointermove=e=>{v.style.setProperty('--mx',e.clientX+'px');v.style.setProperty('--my',e.clientY+'px')};
 const vs=t=>{$('vc').textContent=t};const prog=()=>{$('vp').textContent='EVIDENCE '+Object.keys(found).filter(k=>k!='done').length+' / 5  ·  needed: 📷 + 🖥️'};prog();vs('You step inside. It is dark. Use your flashlight (move the mouse / your finger) to find the equipment.');
 const modal=h=>{const m=$('vm');m.innerHTML=h+'<button class="btn" id="vcl">Close ✕</button>';m.classList.add('on');$('vcl').onclick=()=>{m.classList.remove('on');prog();check()}};
 v.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const k=el.dataset.k;el.classList.add('dn');found[k]=1;prog();
  if(k=='cam')modal('<h2 style="font-family:Playfair Display;font-style:italic;color:#fff">📷 Photos from the camera roll</h2><div class="vgal">'+VAN_PHOTOS.map((p,n)=>'<div class="pol">'+(p?'<img src="'+p+'">':'<div class="ph">photo '+(n+1)+' goes here</div>')+'<b>photo '+(n+1)+'</b></div>').join('')+'</div>');
  if(k=='mon')modal('<h2 style="font-family:Playfair Display;font-style:italic;color:#fff">🖥️ Truck monitor: incoming transmission</h2><div class="crt">'+yt(YT_TRAILER,'trailer')+'</div>');
  if(k=='rad'){vs('📻 “…m…er…ry… chr…ist…mas… b…est…ie…”');[0,.2,.4,.6].forEach(()=>hiss(.25))}
  if(k=='jr')modal('<div class="pol" style="transform:rotate(1deg)"><div class="ph" style="aspect-ratio:auto;text-align:left;display:block;font-size:1.3rem;line-height:1.5">GHOST JOURNAL<br>✔ Santa hat sighting<br>✔ Haunted couture (suspicious)<br>✘ Mince pies (missing)</div></div>');
  if(k=='emf'){[0,.25,.5,.7,.85,.95].forEach((t,n)=>tone(600+n*150,t,.12,'square',.05));vs('📟 EMF level 5. That is… a lot of tinsel.')}});
 const check=()=>{if(found.cam&&found.mon&&!found.done){found.done=1;setTimeout(()=>{v.classList.add('strobe');tone(60,0,2.5,'sawtooth',.08);tone(64,0,2.5,'sawtooth',.08);v.insertAdjacentHTML('beforeend','<div class="vghost">👻</div>');vs('“Haunted Couture 2026.” The ghost smiles. It has a tiny Santa hat.');setTimeout(()=>{v.classList.remove('strobe');chime();v.insertAdjacentHTML('beforeend','<button class="btn" id="vx2" style="position:absolute;z-index:7;left:50%;bottom:16%;transform:translateX(-50%);font-size:1.2rem;padding:.8rem 1.6rem">Back to the train 🚂</button>');$('vx2').onclick=finish},2200)},500)}}}
function yt(id,l){return id?'<iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen allow="fullscreen"></iframe>':'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:monospace;padding:1rem;text-align:center">[ '+l+' plays here. Paste the YouTube ID into YT_'+(l=='trailer'?'TRAILER':'FULL')+' ]</div>'}
/* stop 40: the premiere */
function premiere(i){const p=$('pm');p.classList.add('on');mmode='f';
 p.innerHTML='<div class="bulbs"></div><div class="cine" id="cn"><div style="padding:1rem"><div class="tag" style="color:var(--gold)">Besties Studios presents</div><h2 style="font:italic 700 clamp(1.5rem,5vw,2.6rem) Playfair Display;color:#fff">Phasmophobia Fashion Week<br>Haunted Couture 2026</h2></div><div class="cur2 l"></div><div class="cur2 r"></div></div><div id="pb"><button class="btn" id="cu" style="font-size:1.2rem">Raise the curtain 🎬</button></div>';
 $('cu').onclick=function(){this.disabled=true;chime();$('cn').classList.add('open');setTimeout(()=>{$('cn').insertAdjacentHTML('beforeend',yt(YT_FULL,'film'));$('pb').innerHTML='<button class="btn" id="fn">When the film is done, press here ♡</button>';$('fn').onclick=finish},3000)}}
function finale(){$('fin').classList.add('on');let n=0;const iv=setInterval(()=>{burst(rnd(.15,.85)*innerWidth,rnd(.1,.55)*innerHeight,70,['#f6dc7a','#ff6b81','#7ee8c4','#fff'][n%4]);chime();if(++n>45)clearInterval(iv)},700)}
/* ================= wiring ================= */
world.addEventListener('click',e=>{const k=e.target.closest('.pk,#vvx');if(!k)return;const s=k.closest('.st');if(s&&s.id=='st'+cur)openStop(cur)});
$('mb').onclick=()=>$('mm').classList.toggle('on');$('m1').onclick=()=>setMute(!muted);$('m2').onclick=()=>whistle();
$('m3').onclick=()=>{if(confirm('Reset ALL progress and start the journey again?')){try{localStorage.removeItem('xmx2_open')}catch(e){}location.href=location.pathname}};
$('again').onclick=()=>$('fin').classList.remove('on');
addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H')whistle()});
const begin=fast=>{B.classList.add('on');$('intro').classList.add('out');st='wait';
 let u=0;while(u<N&&opened.has(u))u++;if(q.get('at'))u=Math.min(N-1,+q.get('at'));if(q.get('skip'))for(let i=0;i<u;i++)opened.add(i);
 if(u>=N){opened.clear()}
 if(u>0||fast){tx=trX(u)-1;cur=u;foc=focT=tx+380;hud();arrive();train.classList.remove('run');return}
 au();startMusic();whistle();setTimeout(()=>chap(CH[0]),1200);setTimeout(()=>say('Welcome aboard the Besties Express. Please keep all plushies inside the carriage.',4800),5200);setTimeout(()=>goTo(0),5800)};
$('aboard').onclick=()=>begin(false);
if(q.get('skip')||q.get('at')||opened.size>0)addEventListener('pointerdown',()=>startMusic(),{once:true});
if(q.get('skip')||q.get('at'))begin(true);else if(opened.size>0){$('aboard').textContent='Continue the journey 🚂';$('aboard').onclick=()=>{au();startMusic();begin(true)}}
foc=focT=380;hud();requestAnimationFrame(frame);
})();
