<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Besties ♡</title>
<link rel="icon" type="image/x-icon" href="media/shared/images/site_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<script src="js/theme.js"></script>
<style>:root{--passport:#1a4a2a;--passport-light:#2a6a3a;--passport-gold:#d4a830}
.page-header{text-align:center;padding:3rem 2rem 1rem;animation:headerIn 0.7s ease both}
@keyframes headerIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
/* PASSPORT BOOK */
.passport-wrap{margin:2rem auto 5rem;padding:0 1.5rem;display:flex;flex-direction:column;align-items:center;gap:2.5rem}
.passport-book{width:100%;max-width:500px;background:var(--passport);box-shadow:6px 8px 40px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08);position:relative;animation:bookIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s both}
@keyframes bookIn{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:translateY(0) rotate(0deg)}}
.passport-cover{padding:2.5rem 2rem;text-align:center;border-bottom:2px solid rgba(212,168,48,0.3);position:relative}
.passport-cover::before{content:'';position:absolute;inset:10px;border:1px solid rgba(212,168,48,0.2);pointer-events:none}
.passport-emblem{font-size:3.5rem;margin-bottom:0.5rem;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3))}
.passport-country{font-family:'Playfair Display',serif;font-size:0.85rem;letter-spacing:4px;text-transform:uppercase;color:var(--passport-gold);margin-bottom:0.2rem}
.passport-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:rgba(255,255,255,0.9);line-height:1.1}
.passport-subtitle{font-family:'Caveat',cursive;font-size:0.85rem;color:rgba(255,255,255,0.4);margin-top:0.3rem;letter-spacing:1px}
.holder-section{padding:1.5rem 2rem;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
.holder-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
.holder-field label{font-family:'Caveat',cursive;font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);display:block;margin-bottom:0.15rem}
.holder-field span{font-family:'Caveat',cursive;font-size:1.05rem;color:rgba(255,255,255,0.85)}
.holder-photo{width:70px;height:84px;border:2px solid rgba(212,168,48,0.4);display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:rgba(0,0,0,0.2);flex-shrink:0}
.holder-row{display:flex;gap:1rem;align-items:flex-start}
.holder-info{flex:1}
/* STAMPS SECTION */
.stamps-section{padding:1.5rem 2rem}
.stamps-title{font-family:'Caveat',cursive;font-size:0.8rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:1.2rem;padding-bottom:0.5rem;border-bottom:1px dashed rgba(255,255,255,0.1)}
.stamp-entry{margin-bottom:1.4rem;padding:1rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);position:relative}
.stamp-entry.departure .stamp-circle{border-color:var(--rose);color:var(--rose)}
.stamp-entry.arrival .stamp-circle{border-color:var(--sage);color:var(--sage)}
.stamp-header{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.6rem}
.stamp-circle{width:52px;height:52px;border:2.5px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;font-family:'Caveat',cursive;flex-shrink:0;position:relative}
.stamp-circle-inner{text-align:center;line-height:1.2}
.stamp-type{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:rgba(255,255,255,0.85)}
.stamp-meta{font-family:'Caveat',cursive;font-size:0.85rem;color:rgba(255,255,255,0.45);display:flex;gap:0.7rem;flex-wrap:wrap;margin-top:0.1rem}
.stamp-meta span{display:flex;align-items:center;gap:0.25rem}
.stamp-note{font-size:0.88rem;line-height:1.6;color:rgba(255,255,255,0.55);font-style:italic;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.06)}
.stamp-number{position:absolute;top:0.6rem;right:0.8rem;font-family:'Caveat',cursive;font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:2px}
/* future stamps */
.stamp-entry.future{opacity:0.4;border-style:dashed}
.stamp-entry.future .stamp-type{font-style:italic;color:rgba(255,255,255,0.5)}
.future-label{font-family:'Caveat',cursive;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.2);margin:0.5rem 0;text-align:center}
/* MRZ strip */
.mrz{padding:1rem 2rem;background:rgba(0,0,0,0.2);font-family:'Courier New',monospace;font-size:0.65rem;color:rgba(255,255,255,0.2);letter-spacing:0.5px;overflow:hidden;word-break:break-all;line-height:1.7;border-top:1px solid rgba(255,255,255,0.05)}
/* ABOUT SECTION */
.about-section{max-width:500px;width:100%;background:var(--paper);border:1px solid var(--tan);padding:1.8rem 2rem;box-shadow:5px 5px 0 var(--warm);animation:bookIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.4s both}
.about-section h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--deep);margin-bottom:0.6rem}
.about-section p{font-size:0.95rem;line-height:1.8;color:var(--brown)}
.about-section p+p{margin-top:0.6rem}
.trip-counter{display:flex;gap:1.5rem;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--warm)}
.counter-item{text-align:center;flex:1}
.counter-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1}
.counter-label{font-family:'Caveat',cursive;font-size:0.8rem;color:var(--brown);letter-spacing:1px}

/* PASSPORTS SIDE BY SIDE: one passport = centred like before; 2+ = share the full width */
.passport-wrap{max-width:none}
.pp-stage{width:100%;max-width:520px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem;align-items:start}
.pp-stage.multi{max-width:1500px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:2.5rem 2rem}
.pp-col{display:flex;flex-direction:column;align-items:center;gap:2.2rem;min-width:0;scroll-margin-top:5rem}
.pp-stage.multi .passport-book,.pp-stage.multi .about-section{max-width:none}
.pp-col .passport-book,.pp-col .about-section{width:100%}
/* per-passport colours: set by the data (cover: {bg, light, gold}) */
.passport-book{--passport:var(--pp-bg,#1a4a2a);--passport-gold:var(--pp-gold,#d4a830)}
.stamp-entry.visit .stamp-circle{border-color:var(--passport-gold);color:var(--passport-gold)}
.no-stamps{font-family:'Caveat',cursive;font-size:.95rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;padding:1rem 0}
@media (prefers-reduced-motion:reduce){.passport-book,.about-section{animation:none}}
@media (max-width:520px){.holder-section,.stamps-section,.passport-cover,.mrz{padding-left:1.2rem;padding-right:1.2rem}.about-section{padding:1.4rem 1.2rem}}
</style>
</head>
<body>
<nav id="site-nav">
  <a href="index.html" class="nav-brand">Besties ♡</a>
  <div class="nav-links"></div>
</nav>
<div class="page-header page-header--std">
  <h1 id="pp-heading">The Plushie Passports</h1>
  <p>Official travel documents for our little ambassadors</p>
</div>

<div class="passport-wrap">
  <div class="pp-stage" id="pp-stage"></div>
</div>

<script src="js/nav.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
// PASSPORTS - one entry per plushie. Add a plushie by copying an entry.
// Only entries with ready !== false are shown. One passport sits centred; two or more
// sit side by side across the whole page (stacking on phones).
//
//   id          unique, no spaces                  (share link: passport.html#id)
//   ready       false = hidden completely (use it to keep a plushie secret until its reveal)
//   tabLabel    short name (used as the fallback nickname)
//   emoji       on the cover and the photo box
//   country     line above the title on the cover
//   title       big cover title
//   subtitle    small line under the title
//   cover       optional colours: { bg: '#1a4a2a', gold: '#d4a830' }
//   fields      the holder details, as [label, value] pairs, in order.
//               Keep 'Legal Name' and 'Nickname' first; the rest is up to you.
//   stamps      the journey, oldest first. Numbers (STAMP 001...) are added for you.
//                 type: 'departure' | 'arrival' | 'visit'
//                 place, date, note
//                 future: true   shows the stamp faded under "future journeys"
//                 (type 'visit' = a stamp for a trip/outing that isn't a handover)
//   mrz         optional two lines for the bottom strip. Left out = made up from the fields.
//   about       { title, paragraphs: [...] }       the card under the passport
//   counters    optional, replaces the three numbers. Left out = trips taken / homes visited
//               are counted from the stamps, plus "Many more to go".
// ══════════════════════════════════════════════════════════════════
const PASSPORTS = [
  { id: 'beans', tabLabel: 'Beans', emoji: ':teddy_bear:',
    country: 'Lord Nooks Republic', title: 'TRAVEL DOCUMENT', subtitle: 'Bestie Ambassador',
    fields: [
      ['Legal Name', 'Tristan'], ['Given name', 'lil Beans Guy'],
      ['Nationality', 'Anglo-Dutch'], ['Issued', '15 Jul 2026'],
      ['Status', 'Ambassador'], ['Passport No.', 'JVM-327'],
    ],
    stamps: [
      { type: 'departure', place: 'Preston, UK',     date: 'Jul 2025', note: 'First ever departure. The plushie begins its journey - packed carefully inside a Heinz Beans can, which is a perfect home.' },
      { type: 'arrival',   place: 'The Netherlands', date: 'Aug 2025', note: 'First landing at Ann\'s, to hide in a box until ready to be opened.' },
      { type: 'departure', place: 'The Netherlands', date: 'Dec 2026', note: 'First return journey - heading back to Tristan for Christmas.' },
      { type: 'arrival',   place: 'Preston, UK',     date: 'Dec 2026', note: 'Home for Christmas. First full round trip complete.' },
    ],
    mrz: [
      'P<ENG<<LIL<BEANS<GUY<<<<<<<<<<<<<<<<<<<<<<<<',
      '<<<<<<<<<0ENG2607159M3107151<<<<<<<<<<<<<<06',
    ],
    about: { title: 'About the Plushie Tradition', paragraphs: [
      'This little plushie is the start of something that will hopefully go on for a long time. It lives at your place for six months, then comes home to me for six months - back and forth, moving twice a year, accumulating stamps in this passport.',
    ] },
  },

  // ---- The second plushie ----
  // Fill in the "???" bits, then delete the line "ready: false" to show it. Until then nobody sees it.
  { id: 'second', ready: true, tabLabel: '???', emoji: ':teddy_bear:',
    country: 'Lord Nooks Republic', title: 'TRAVEL DOCUMENT', subtitle: 'Bestie Ambassador',
    cover: { bg: '#1b2f55', gold: '#d9b44a' },
    fields: [
      ['Legal Name', 'Kiki'], ['Given name', 'lil Diva'],
      ['Nationality', 'Bri\'ish'], ['Issued', '12 Nov 2026'],
      ['Status', 'Ambassador'], ['Passport No.', 'RLE-235'],
    ],
    stamps: [
      { type: 'departure', place: 'Preston, UK',     date: 'Dec 2026', note: 'First ever departure. This plushie begins its journey packed carefully, joining the tradition.' },
      { type: 'arrival',   place: 'The Netherlands', date: 'Dec 2026', note: 'First landing at Ann\'s, to hide in a box until ready to be opened.' },
    ],
    mrz: [
      'P<ENG<<LIL<DIVA<<<<<<<<<<<<<<<<<<<<<<<<<<<<<',
      '<<<<<<<<<0ENG2611125M3111127<<<<<<<<<<<<<<06',
    ],
    about: { title: 'About this plushie', paragraphs: [
      'After searching far and wide for 3 months, the perfect plushie was finally found and they joined the plushie tradition in October 2026.',
    ] },
  },
];

// ══════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shown = () => PASSPORTS.filter(p => p.ready !== false);

const STAMP_KINDS = {
  departure: { word: 'DEPARTURE', circle: 'Dept<br>✈' },
  arrival:   { word: 'ARRIVAL',   circle: 'Arrv<br>🏠' },
  visit:     { word: 'VISIT',     circle: 'Visit<br>📸' },
};

function makeMrz(p) {
  const clean = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]+/g, '<');
  const pad = (t, n) => (t + '<'.repeat(n)).slice(0, n);
  const f = Object.fromEntries((p.fields || []).map(([k, v]) => [k, v]));
  return [
    pad('P<LNR<' + clean(f['Nickname'] || f['Given name'] || p.tabLabel) + '<<THE<PLUSHIE', 44),
    pad(clean(f['Passport No.'] || p.id) + clean(f['Issued']), 44),
  ];
}

function bookHTML(p) {
  const kinds = STAMP_KINDS;
  const stamps = p.stamps || [];
  const real = stamps.filter(s => !s.future), future = stamps.filter(s => s.future);
  let n = 0;
  const stampHTML = s => {
    n++;
    const k = kinds[s.type] || kinds.visit;
    return `
      <div class="stamp-entry ${esc(kinds[s.type] ? s.type : 'visit')}${s.future ? ' future' : ''}">
        <div class="stamp-number">STAMP ${String(n).padStart(3, '0')}</div>
        <div class="stamp-header">
          <div class="stamp-circle"><div class="stamp-circle-inner">${k.circle}</div></div>
          <div>
            <div class="stamp-type">${k.word}</div>
            <div class="stamp-meta">${s.place ? `<span>📍 ${esc(s.place)}</span>` : ''}${s.date ? `<span>📅 ${esc(s.date)}</span>` : ''}</div>
          </div>
        </div>
        ${s.note ? `<div class="stamp-note">${esc(s.note)}</div>` : ''}
      </div>`;
  };
  const mrz = (p.mrz && p.mrz.length ? p.mrz : makeMrz(p)).map(esc).join('<br>\n      ');
  const cov = p.cover || {};
  const style = (cov.bg ? `--pp-bg:${esc(cov.bg)};` : '') + (cov.gold ? `--pp-gold:${esc(cov.gold)};` : '');
  return `
  <div class="passport-book" style="${style}">
    <div class="passport-cover">
      <span class="passport-emblem">${esc(p.emoji || '🧸')}</span>
      <div class="passport-country">${esc(p.country)}</div>
      <div class="passport-title">${esc(p.title)}</div>
      <div class="passport-subtitle">${esc(p.subtitle)}</div>
    </div>
    <div class="holder-section"><div class="holder-row">
      <div class="holder-photo">${esc(p.emoji || '🧸')}</div>
      <div class="holder-info"><div class="holder-grid">
        ${(p.fields || []).map(([l, v]) => `<div class="holder-field"><label>${esc(l)}</label><span>${esc(v)}</span></div>`).join('')}
      </div></div>
    </div></div>
    <div class="stamps-section">
      <div class="stamps-title">Entry / Exit Stamps</div>
      ${real.map(stampHTML).join('')}
      ${!stamps.length ? '<div class="no-stamps">- no stamps yet -</div>' : ''}
      ${future.length ? '<div class="future-label">- future journeys -</div>' + future.map(stampHTML).join('') : ''}
    </div>
    <div class="mrz">${mrz}</div>
  </div>`;
}

function aboutHTML(p) {
  const a = p.about;
  if (!a) return '';
  const stamps = (p.stamps || []).filter(s => !s.future);
  const trips = stamps.filter(s => s.type === 'arrival').length;
  const homes = new Set(stamps.map(s => s.place).filter(Boolean)).size;
  const counters = p.counters || [
    { num: trips, label: trips === 1 ? 'trip taken' : 'trips taken' },
    { num: homes, label: homes === 1 ? 'home visited' : 'homes visited' },
    { num: 'Many', label: 'more to go' },
  ];
  return `
  <div class="about-section">
    <h2>${esc(a.title)}</h2>
    ${(a.paragraphs || []).map(t => `<p>${esc(t)}</p>`).join('')}
    <div class="trip-counter">
      ${counters.map(c => `<div class="counter-item"><div class="counter-num">${esc(c.num)}</div><div class="counter-label">${esc(c.label)}</div></div>`).join('')}
    </div>
  </div>`;
}

function renderAll() {
  const list = shown();
  const stage = $('pp-stage');
  if (!list.length) { stage.innerHTML = '<p style="font-family:Caveat,cursive;color:var(--brown);font-size:1.2rem;text-align:center">no passports issued yet ♡</p>'; return; }
  stage.classList.toggle('multi', list.length > 1);
  stage.innerHTML = list.map(p => `<div class="pp-col" id="pp-${esc(p.id)}">${bookHTML(p)}${aboutHTML(p)}</div>`).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  buildNav('passport.html');
  renderAll();
  // passport.html#second scrolls to that passport
  let hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const target = hash && document.getElementById('pp-' + hash);
  if (target && shown().length > 1) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
});
</script>
</body>
</html>
